[package]
name = "mt5700d"
version = "2.1.3"
edition = "2021"
description = "MT5700M 5G module management backend: LuCI RPC bridge, AT command, URC/event bus, schedule and cellscan"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"
async-trait = "0.1"
# QQ 机器人 openid 自动绑定：后端直连官方 WebSocket 网关抓取事件
# （rustls 栈与 ureq 共用，避免引入 openssl）
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# QQ 扫码绑定：解密官方回传的 AppSecret（AES-256-GCM，纯 Rust 实现，
# 不引入 C/openssl，交叉编译到 Cortex-A53 时与 rustls 栈互不影响）
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# 二维码矩阵生成（只要矩阵，不用它的图像/SVG 后端；零额外依赖）
qrcodegen = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-package]
# 保持与 release 相同的优化，用于 OpenWrt 交叉编译的瘦身
inherits = "release"
