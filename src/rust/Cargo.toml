[package]
name = "at-webserver"
version = "2.4.22"
edition = "2021"
description = "MT5700 Console backend (MT5700M-CN 5G module): LuCI RPC bridge, AT channel, URC/event bus, SMS PDU, schedule"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"
async-trait = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-package]
# 保持与 release 相同的优化，用于 OpenWrt 交叉编译的瘦身
inherits = "release"
