<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MT5700M · WebUI</title>
<style>
  :root{
    --accent:#4F6EF7;
    --accent2:#7B61FF;
    --accent-grad:linear-gradient(135deg,#4F6EF7 0%,#7B61FF 100%);
    --text:#1a1a2e;
    --text-2:#555770;
    --text-3:#8b8da3;
    --glass:rgba(255,255,255,.72);
    --glass-strong:rgba(255,255,255,.85);
    --glass-border:rgba(255,255,255,.6);
    --hair:rgba(0,0,0,.05);
    --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --sig-good:#22c55e; --sig-warn:#f59e0b; --sig-bad:#ef4444;
    --shadow:0 8px 32px rgba(15,23,42,.1);
    --shadow-lg:0 20px 60px rgba(15,23,42,.15);
    --radius:20px;
    --radius-sm:14px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --text:#e8e8f0; --text-2:#9d9db5; --text-3:#6b6d82;
      --glass:rgba(30,30,48,.6);
      --glass-strong:rgba(40,40,60,.72);
      --glass-border:rgba(255,255,255,.1);
      --hair:rgba(255,255,255,.06);
      --shadow:0 8px 32px rgba(0,0,0,.35);
      --shadow-lg:0 20px 60px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    color:var(--text);
    background:#dbeafe url('bg1.jpg') center top / cover no-repeat fixed;
    overflow:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;background:rgba(220,232,254,.35);z-index:0;pointer-events:none;
  }
  @media (prefers-color-scheme: dark){
    body{background:#0f0f1a url('bg1.jpg') center top / cover no-repeat fixed}
    body::before{background:rgba(10,10,20,.55)}
  }

  .shell{position:relative;z-index:1;display:flex;gap:20px;height:100vh;padding:20px;max-width:1280px;margin:0 auto}

  /* ===== Sidebar ===== */
  .sidebar{
    width:216px;flex:none;display:flex;flex-direction:column;gap:8px;
    background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 12px;overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar{width:4px}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(127,127,127,.2);border-radius:4px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;font-weight:800;font-size:16px;letter-spacing:.3px}
  .brand .logo{
    width:34px;height:34px;border-radius:11px;background:var(--accent-grad);
    display:grid;place-items:center;font-size:17px;color:#fff;box-shadow:0 4px 14px rgba(79,110,247,.4);
  }
  .nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);border:0;cursor:pointer;
    background:transparent;color:var(--text-2);font-size:13.5px;font-weight:600;text-align:left;width:100%;
    transition:all .18s cubic-bezier(.34,1.56,.64,1);
  }
  .nav-item .ico{width:19px;height:19px;flex:none;opacity:.75}
  .nav-item:hover{background:rgba(79,110,247,.08);color:var(--text)}
  .nav-item:hover .ico{opacity:1}
  .nav-item:active{transform:scale(.96)}
  .nav-item.active{color:#fff;background:var(--accent-grad);box-shadow:0 4px 16px rgba(79,110,247,.32)}
  .nav-item.active .ico{color:#fff;opacity:1}

  /* Nav section divider */
  .nav-sep{height:1px;background:var(--hair);margin:6px 8px}
  .nav-section-label{font-size:10px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:8px 12px 4px}

  .conn{
    display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);
    background:rgba(127,127,127,.08);font-size:12px;color:var(--text-2);margin-top:4px;
  }
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none;transition:all .3s}
  .conn.on .dot{background:var(--good);box-shadow:0 0 0 3px rgba(34,197,94,.2)}
  .conn.on{color:var(--text)}

  /* ===== Main area ===== */
  .main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden}

  /* Top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
  .topbar-left{display:flex;align-items:center;gap:12px}
  .topbar h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.2px;line-height:1.2}
  .topbar .sub{font-size:12.5px;color:var(--text-2);margin-top:1px}
  .topbar-right{display:flex;align-items:center;gap:10px}

  /* Refresh button */
  .refresh-btn{
    width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
    display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);color:var(--text-2);
    transition:all .2s cubic-bezier(.34,1.56,.64,1);flex:none;
  }
  .refresh-btn:hover{background:var(--glass-strong);color:var(--text);transform:rotate(180deg)}
  .refresh-btn:active{transform:scale(.9) rotate(180deg)}
  .refresh-btn .ico{width:16px;height:16px}
  .refresh-btn.spinning .ico{animation:spin .6s linear infinite}

  /* Status pill */
  .status-pill{
    display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
    background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);font-size:12px;font-weight:600;
  }
  .status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);transition:background .3s}
  .status-pill.on .dot{background:var(--good);box-shadow:0 0 0 3px rgba(34,197,94,.2)}

  /* Scrollable content */
  .scroller{flex:1;overflow-y:auto;padding-right:4px;margin-right:-4px}
  .scroller::-webkit-scrollbar{width:6px}
  .scroller::-webkit-scrollbar-thumb{background:rgba(127,127,127,.25);border-radius:6px}
  .scroller::-webkit-scrollbar-thumb:hover{background:rgba(127,127,127,.38)}

  /* Grid system */
  .grid{display:grid;gap:14px}
  .grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .grid.cols-4{grid-template-columns:repeat(4,1fr)}

  /* ===== Cards ===== */
  .card{
    background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid var(--glass-border);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 20px;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .card h3{margin:0 0 2px;font-size:14.5px;font-weight:700}
  .card .desc{font-size:11.5px;color:var(--text-2);margin-bottom:12px;line-height:1.5}
  .card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}

  /* Badge */
  .badge{
    display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;
    background:rgba(127,127,127,.12);color:var(--text-2);font-size:11px;font-weight:700;white-space:nowrap;flex:none;
  }
  .badge.good{background:rgba(34,197,94,.14);color:#16a34a}
  .badge.warn{background:rgba(245,158,11,.14);color:#d97706}
  .badge.bad{background:rgba(239,68,68,.14);color:#dc2626}
  .badge.white{background:rgba(255,255,255,.22);color:#fff}
  .badge.blue{background:rgba(79,110,247,.14);color:#4F6EF7}

  /* Hero card (signal overview) */
  .hero{
    position:relative;overflow:hidden;background:var(--accent-grad);color:#fff;border:0;
    min-height:180px;display:flex;flex-direction:column;justify-content:center;
  }
  .hero::after{
    content:'';position:absolute;width:200px;height:200px;right:-50px;top:-80px;
    border:40px solid rgba(255,255,255,.09);border-radius:50%;
  }
  .hero .head,.hero h3{color:#fff;position:relative;z-index:1}
  .hero .big{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1;position:relative;z-index:1}
  .hero .big small{font-size:14px;font-weight:600;opacity:.78;margin-left:6px}
  .hero .desc{color:rgba(255,255,255,.8);position:relative;z-index:1}
  .hero .meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:11.5px;position:relative;z-index:1}
  .hero .meta span b{color:#fff;font-weight:700;margin-left:4px}

  /* ===== Signal bars — FIX: bright green, visible on any background ===== */
  .bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin:8px 0 6px}
  .bars i{
    flex:1;border-radius:4px 4px 2px 2px;background:rgba(127,127,127,.22);
    transition:height .5s cubic-bezier(.2,.8,.2,1),background .3s;
  }
  .bars i.on{background:#22c55e}/* bright green — always visible */
  .hero .bars i.on{background:#fff}/* white on blue hero bg */

  /* Large signal bars for dashboard */
  .bars-lg{display:flex;align-items:flex-end;gap:5px;height:80px;margin:10px 0 8px}
  .bars-lg i{
    width:18px;border-radius:5px 5px 3px 3px;background:rgba(127,127,127,.18);
    transition:height .5s cubic-bezier(.2,.8,.2,1),background .3s;
  }
  .bars-lg i.on{background:linear-gradient(180deg,#22c55e 0%,#16a34a 100%);box-shadow:0 2px 8px rgba(34,197,94,.3)}

  /* ===== Signal Dashboard ===== */
  .sig-row{display:flex;gap:16px;align-items:stretch}
  .sig-left{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:80px}
  .sig-badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
  .sig-quality{text-align:center;font-size:11px;color:var(--text-3)}
  .sig-quality b{font-size:18px;font-weight:800;color:var(--good)}

  /* Three big metrics (RSRP / SINR / RSRQ) */
  .sig-metrics{display:flex;gap:12px;flex:1}
  .sig-metric{
    flex:1;text-align:center;padding:14px 10px;border-radius:var(--radius-sm);
    background:rgba(127,127,127,.04);border:1px solid var(--hair);
  }
  .sig-metric .m-val{font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-1px}
  .sig-metric .m-unit{font-size:12px;color:var(--text-2);font-weight:600;margin-top:1px}
  .sig-metric .m-desc{font-size:10px;color:var(--text-3);margin-top:2px}
  .sig-metric.m-rsrp .m-val{color:var(--sig-good)}
  .sig-metric.m-sinr .m-val{color:var(--sig-warn)}
  .sig-metric.m-rsrq .m-val{color:var(--sig-bad)}

  /* Network params grid */
  .net-params{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
  .net-params .kv{padding:5px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
  .net-params .kv:last-child{border-bottom:0}

  /* Carrier aggregation card */
  .carrier-card{border-left:4px solid var(--accent);padding-left:14px}
  .carrier-card .c-title{font-weight:700;font-size:13.5px;color:var(--accent);margin-bottom:8px}
  .carrier-card .c-band{font-weight:700;font-size:13px;margin-bottom:6px}
  .carrier-detail{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:12px}
  .carrier-detail .kv{padding:4px 0;border-bottom:1px solid var(--hair)}
  .carrier-detail .kv:last-child{border-bottom:0}
  .carrier-detail .v.mcs-good{color:var(--sig-good);font-weight:700}
  .carrier-detail .v.mcs-bad{color:var(--sig-bad);font-weight:700}

  /* Colored value bars */
  .val-bar{
    display:flex;align-items:center;gap:8px;margin:4px 0;
  }
  .val-bar .bar-wrap{flex:1;height:26px;border-radius:6px;overflow:hidden;background:rgba(127,127,127,.1)}
  .val-bar .bar-fill{height:100%;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;color:#fff;border-radius:inherit;transition:width .5s;
  }
  .val-bar .bar-fill.bg-good{background:linear-gradient(135deg,#22c55e,#16a34a)}
  .val-bar .bar-fill.bg-warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
  .val-bar .bar-fill.bg-bad{background:linear-gradient(135deg,#ef4444,#dc2626)}
  .val-bar .bar-label{font-size:11.5px;font-weight:600;color:var(--text-2);min-width:48px;text-align:right}

  /* SSB beam info */
  .ssb-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .ssb-item{
    flex:1;min-width:70px;text-align:center;padding:10px 6px;border-radius:12px;
    background:rgba(127,127,127,.04);border:1px solid var(--hair);
  }
  .ssb-item .ssb-name{font-size:11px;color:var(--text-3);margin-bottom:4px}
  .ssb-item .ssb-val{font-size:13px;font-weight:700}
  .ssb-item .ssb-val.c-good{color:var(--sig-good)}
  .ssb-item .ssb-val.c-warn{color:var(--sig-warn)}
  .ssb-item .ssb-val.c-bad{color:var(--sig-bad)}

  /* KV rows */
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--text-2);flex:none;min-width:72px}
  .kv .v{font-weight:600;text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}

  /* Metric with progress bar */
  .metric{margin-bottom:10px}
  .metric:last-child{margin-bottom:0}
  .metric .m-top{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:4px}
  .metric .m-top .m-val{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .gauge{height:6px;border-radius:99px;background:rgba(127,127,127,.14);overflow:hidden}
  .gauge i{display:block;height:100%;border-radius:inherit;background:var(--accent-grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border:0;border-radius:var(--radius-sm);
    background:var(--accent-grad);color:#fff;font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 16px rgba(79,110,247,.3);
    transition:all .18s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:hover{filter:brightness(1.06);box-shadow:0 6px 22px rgba(79,110,247,.38);transform:translateY(-1px)}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:var(--glass-strong);color:var(--text);box-shadow:none;border:1px solid var(--glass-border)}
  .btn.ghost:hover{background:var(--glass);transform:none}
  .btn.sm{padding:6px 14px;font-size:11.5px}
  .btn.disabled{opacity:.45;cursor:not-allowed;transform:none!important}
  .btn-link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600;padding:4px 8px;border-radius:6px}
  .btn-link:hover{background:rgba(79,110,247,.08)}

  /* Form fields */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:11.5px;color:var(--text-2);font-weight:600}
  .input,textarea{
    width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--glass-border);
    background:var(--glass-strong);color:var(--text);font-size:13.5px;font-family:inherit;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.15)}
  textarea{resize:vertical;min-height:80px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55}

  /* Terminal */
  .term{
    background:rgba(12,14,28,.92);border-radius:var(--radius-sm);padding:14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#b8c8ff;
    height:280px;overflow:auto;line-height:1.58;white-space:pre-wrap;word-break:break-word;
  }
  @media (prefers-color-scheme: dark){.term{background:rgba(0,0,0,.5)}}
  .term .ts{color:#5a72a8}
  .term .cmd{color:#6ee7a0}
  .term .err{color:#ff9090}

  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .row .input{flex:1}
  .hint{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.5}
  .loading{text-align:center;color:var(--text-2);font-size:13px;padding:28px}
  .spin{width:16px;height:16px;border:2px solid rgba(127,127,127,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center-empty{text-align:center;color:var(--text-3);font-size:13px;padding:20px}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);
    background:rgba(20,20,32,.88);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);
    font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:100;backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* SMS list */
  .sms-list{display:flex;flex-direction:column;gap:8px}
  .sms-item{
    background:var(--glass-strong);border:1px solid var(--glass-border);
    border-radius:14px;padding:11px 14px;transition:background .15s;
  }
  .sms-item:hover{background:var(--glass)}
  .sms-item .sm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .sms-item .from{font-weight:700;font-size:12.5px}
  .sms-item .date{font-size:11px;color:var(--text-3)}
  .sms-item .body{font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--text-2)}

  /* Temp monitoring cards */
  .temp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .temp-item{
    text-align:center;padding:14px 10px;border-radius:var(--radius-sm);
    background:rgba(127,127,127,.03);border:1px solid var(--hair);
  }
  .temp-item .t-name{font-size:11px;color:var(--text-3);margin-bottom:6px}
  .temp-item .t-val{font-size:24px;font-weight:800;color:var(--sig-good)}

  /* ========== NEW: Network Speed page (screenshot 4) ========== */
  .speed-live{padding:6px 0}
  .speed-toggle{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .toggle-switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
  .toggle-switch input{opacity:0;width:0;height:0}
  .toggle-switch .slider{
    position:absolute;inset:0;background:rgba(127,127,127,.25);border-radius:99px;
    cursor:pointer;transition:background .25s;
  }
  .toggle-switch .slider::before{
    content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:transform .25s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  .toggle-switch input:checked + .slider{background:var(--accent)}
  .toggle-switch input:checked + .slider::before{transform:translateX(20px)}
  .speed-values{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
  .spd-up,.spd-down{color:var(--text-3);font-size:12px}
  .speed-bps{grid-column:1/-1;display:flex;gap:20px;justify-content:center;font-size:11px;color:var(--text-3);margin-top:4px}
  .spd-bps-val{font-weight:700;font-variant-numeric:tabular-nums}
  .net-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
  .val-red{color:var(--bad);font-weight:700;font-variant-numeric:tabular-nums}

  /* ========== NEW: Lock frequency settings (screenshot 5) ========== */
  .lock-card .lock-section{padding:4px 0}
  .lock-type-row{margin-bottom:10px;font-size:13px;font-weight:600;color:var(--text)}
  .lock-options{display:flex;flex-wrap:wrap;gap:10px}
  .radio-opt{
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);
    background:rgba(127,127,127,.04);border:1px solid var(--hair);cursor:pointer;
    font-size:12.5px;color:var(--text-2);transition:all .15s;user-select:none;
  }
  .radio-opt:hover{background:rgba(79,110,247,.06);border-color:rgba(79,110,247,.2)}
  .radio-opt input[type=radio]{accent-color:var(--accent)}
  .empty-state{text-align:center;padding:28px 16px;color:var(--text-3)}
  .empty-icon{font-size:36px;margin-bottom:8px;opacity:.4}
  .empty-text{font-size:13px}

  /* ========== NEW: Network config (screenshot 6) ========== */
  .conf-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
  .tx-info-box{
    padding:12px 16px;border-radius:var(--radius-sm);
    background:rgba(79,110,247,.07);border:1px solid rgba(79,110,247,.15);
    font-size:13px;color:var(--text-2);line-height:1.6;
  }

  /* ========== NEW: PDP management (screenshot 7) ========== */
  .pdp-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px}
  .pdp-row:last-child{border-bottom:0}
  .pdp-cid{color:var(--text-2);font-weight:600}
  .pdp-state{font-weight:700;font-size:12px;padding:2px 10px;border-radius:999px}
  .pdp-state.active{background:rgba(34,197,94,.12);color:#16a34a}
  .pdp-state:not(.active){background:rgba(127,127,127,.1);color:var(--text-3)}
  .skeleton-list{padding:4px 0}
  .skeleton-row{height:28px;border-radius:6px;background:rgba(127,127,127,.07);margin-bottom:6px;animation:skeleton-pulse 1.4s ease-in-out infinite}
  @keyframes skeleton-pulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* ========== NEW: AT Server Config / Settings (screenshot 8) ========== */
  .at-config{padding:2px 0}
  .at-mode-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:14px;font-weight:700}
  .at-mode-label{color:var(--text)}
  .at-mode-val{font-size:15px}
  .mode-net{color:var(--accent);font-weight:800}
  .mode-local{color:var(--good);font-weight:800}
  .at-mode-desc{font-size:12.5px;color:var(--text-2);margin-bottom:14px;line-height:1.5}
  .at-fields{}
  .at-local-info{padding:8px 0}
  .at-local-info .kv{font-size:12.5px}

  /* ===== Responsive ===== */
  @media (max-width:1200px){
    .temp-grid{grid-template-columns:repeat(3,1fr)}
    .sig-metrics{flex-wrap:wrap}
    .sig-metric{min-width:100px}
    .conf-grid,.net-info-grid{grid-template-columns:1fr}
  }
  @media (max-width:1024px){
    .grid.cols-3{grid-template-columns:repeat(2,1fr)}
    .grid.cols-4{grid-template-columns:repeat(2,1fr)}
    .temp-grid{grid-template-columns:repeat(2,1fr)}
    .speed-values,.lock-options{flex-direction:column}
  }
  @media (max-width:768px){
    .shell{padding:12px;gap:12px}
    .sidebar{display:none}
    .main{width:100%}
    .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
    .hero .big{font-size:30px}
    .topbar h1{font-size:20px}
    .sig-row{flex-direction:column;align-items:center}
    .sig-metrics{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center}
    .sig-metric{flex:1;min-width:90px}
    .net-params{grid-template-columns:1fr}
    .carrier-detail{grid-template-columns:1fr}
    .temp-grid{grid-template-columns:repeat(2,1fr)}
    .speed-values{grid-template-columns:1fr}
    .net-info-grid{grid-template-columns:1fr}
    .conf-grid{grid-template-columns:1fr}
    .lock-options{flex-direction:column}
  }
  @media (max-width:480px){
    .shell{padding:8px;gap:8px}
    .card{padding:14px 16px}
    .kv{font-size:12.5px;padding:7px 0}
    .topbar h1{font-size:18px}
    .sig-metric .m-val{font-size:24px}
    .bars-lg i{width:14px}
    .temp-grid{grid-template-columns:1fr 1fr}
    .at-mode-row{flex-direction:column;align-items:flex-start;gap:6px}
  }
</style>
</head>
