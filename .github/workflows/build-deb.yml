name: Debian 软件包云编译（deb）

# 云编译 Debian 二进制包（.deb），两架构均使用 GitHub 官方原生 runner：
#   - amd64   ubuntu-24.04        x64runner（PC / 虚拟机 / x86 工控机）
#   - arm64   ubuntu-24.04-arm    原生 arm64 runner（树莓派 4/5、ARM 工控机、Arm SystemReady）
#
# 为什么 arm64 用原生 arm runner 而不是 x64 交叉编译：
#   1) 无需 gcc-aarch64-linux-gnu 与 linker/AR 环境变量注入，配置面更小、失败点更少；
#   2) 产物由 arm64 原生工具链产出，不经交叉翻译层，可信度与兼容性更佳；
#   3) ring（ureq/rustls 的 TLS 后端）需要 C 编译器与汇编器，原生 runner 自带 gcc。
#
# 前置条件：仓库必须为 public。GitHub 的 ubuntu-*-arm 免费标签仅对公开仓库开放，
#           仓库转为 private 后该标签不被调度，workflow 将直接失败（不会静默降级）。
#           构建步骤内另有「runner 架构闸门」显式校验 uname -m 与目标架构是否匹配。
#
# 产物：at-webserver_<upstream 版本>-<deb 修订号>_<架构>.deb
# 版本单一来源：src/rust/Cargo.toml 的 version（后端即包本体，避免包版本与
#               二进制版本不一致）。Debian 修订号用 --revision 控制，默认 1。
#
# 架构判定：打包脚本从产物 ELF 自动判定架构（不信任宿主 dpkg --print-architecture），
#           保证包 Architecture 字段与内含二进制必然一致——即使未来改回交叉编译，
#           也不会产出「架构字段与实际二进制不符」的坏包。
#
# 触发：push 到 Debian 分支、打 debian-v* 标签、或手动 workflow_dispatch
# 产物发布：每次编译成功后自动发布 GitHub Release
#   - 标签推送   → 使用该标签名（如 debian-v2.0.0）
#   - 分支推送   → 使用 debian-v<版本>（与 main 分支的 v* 标签空间隔离）
#
# 注意：标签前缀固定为 debian-v，避免与 main 分支（OpenWrt 打包）的 v* 触发
#       同一工作流或造成 Release 同名冲突。

on:
  push:
    branches: [ Debian ]
    tags: [ 'debian-v*' ]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Debian 修订号（打包为 <upstream>-<revision>）'
        required: false
        default: '1'

permissions:
  contents: write

# 分支推送与标签推送若指向同一 sha 会同时触发两个 run，两者 sha 相同。
# Release job 对同一 tag 会 delete + create，并发执行会互相踩踏。
# 按 sha 归入同一并发组并排队（不取消），串行执行即可消除竞争。
concurrency:
  group: deb-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译打包（${{ matrix.deb_arch }} · ${{ matrix.runner }}）
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- amd64：官方 x64 runner，原生编译 ----
          - deb_arch: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            # 原生 runner 上编译器即宿主 gcc，无需交叉配置
            apt_cross: ''
          # ---- arm64：官方原生 arm64 runner（免费，仅 public 仓库可用）----
          # 用原生 arm 机器而非 x64 交叉编译：
          #   1) 无需 gcc-aarch64-linux-gnu 与 linker 注入，配置面更小、失败点更少；
          #   2) 产物由 arm64 原生工具链产出，不经交叉翻译层，可信度更高；
          #   3) ring（ureq/rustls 的 TLS 后端）需要 C 编译器与汇编器，
          #      原生 runner 自带 gcc，天然满足。
          # 注意：ubuntu-*-arm 标签仅在 public 仓库可用；仓库转为 private 后
          #      该标签会导致 workflow 直接失败（GitHub 明确不提供此镜像）。
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            apt_cross: ''

    steps:
      # ---------- 1 ----------
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # ---------- 2 ----------
      - name: 环境准备（校验 runner 架构与构建参数）
        run: |
          set -euo pipefail
          echo "Runner 标签：${{ matrix.runner }}"
          echo "目标架构（deb）：${{ matrix.deb_arch }}"
          echo "Rust 目标三元组：${{ matrix.rust_target }}"
          mkdir -p dist
          # 修订号：workflow_dispatch 输入优先，push/tag 时默认 1
          REV="${{ github.event.inputs.revision }}"
          REV="${REV:-1}"
          echo "Debian 修订号：$REV"
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "DEB_ARCH=${{ matrix.deb_arch }}" >> "$GITHUB_ENV"
          echo "RUST_TARGET=${{ matrix.rust_target }}" >> "$GITHUB_ENV"

      # ---------- 3 ----------
      - name: 依赖安装（Rust 工具链 + 打包工具）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # dpkg（提供 dpkg-deb）、binutils（objdump/readelf）、build-essential、curl
          sudo apt-get install -y -qq dpkg-dev binutils build-essential curl ca-certificates
          # Rust 工具链
          if ! command -v cargo >/dev/null 2>&1; then
            echo "==> 安装 rustup（minimal profile）"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version
          dpkg-deb --version | head -1

      # ---------- 4 ----------
      - name: 构建执行（原生 cargo release）
        run: |
          set -euo pipefail
          echo "==> Runner 实测架构：$(uname -m)"
          # 架构闸门：确认 runner 真实架构与目标架构一致。
          # 原生 arm runner 标签在某些情况下可能不被调度（如仓库转为 private），
          # 此时 workflow 会直接失败而非静默降级；此处再做一次显式校验，
          # 确保「在 arm 机器上编译 arm 包」这一前提成立。
          case "${{ matrix.deb_arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) echo "✓ runner 架构与目标架构匹配" ;;
            *) echo "错误：runner 架构 $(uname -m) 与目标 ${{ matrix.deb_arch }} 不匹配" >&2; exit 1 ;;
          esac
          # dpkg 架构应与目标一致（arm 原生 runner 上即为 arm64）
          echo "==> dpkg 架构：$(dpkg --print-architecture)"
          cd src/rust
          cargo build --release
          echo "==> 编译完成"

      # ---------- 5 ----------
      - name: 产物校验（架构一致性与二进制闸门）
        run: |
          set -euo pipefail
          BIN="src/rust/target/release/at-webserver"
          [ -f "$BIN" ] || { echo "错误：未找到编译产物 $BIN" >&2; exit 1; }
          echo "==> 产物信息"
          ls -lh "$BIN"
          file "$BIN"
          echo "==> 动态依赖（打包脚本据此生成 Depends）"
          objdump -p "$BIN" | awk '/NEEDED/ {print "    " $2}'
          # 产物架构必须与目标架构一致（原生编译下由 runner 架构决定，
          # 这里再断言一次，确保打包脚本拿到的确实是目标架构二进制）
          MACHINE="$(readelf -h "$BIN" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p' | tr '[:upper:]' '[:lower:]')"
          echo "==> ELF Machine：$MACHINE"
          case "${{ matrix.deb_arch }}:$MACHINE" in
            amd64:*x86-64*|arm64:*aarch64*) echo "✓ 产物架构与目标一致" ;;
            *) echo "错误：产物架构 $MACHINE 与目标 ${{ matrix.deb_arch }} 不符" >&2; exit 1 ;;
          esac

      # ---------- 6 ----------
      - name: 打包执行（生成 .deb）
        run: |
          set -euo pipefail
          BIN="src/rust/target/release/at-webserver"
          bash debian/build-deb.sh \
            --bin "$BIN" \
            --out-dir dist \
            --revision "${{ env.REV }}"

      # ---------- 7 ----------
      - name: 产物校验（deb 元数据闸门）
        run: |
          set -euo pipefail
          DEB=$(ls -1 dist/at-webserver_*.deb | head -1)
          [ -f "$DEB" ] || { echo "错误：未生成 deb 产物" >&2; exit 1; }
          echo "==> deb 元数据"
          dpkg-deb --info "$DEB"
          echo "==> 架构一致性闸门（control 声明 vs 期望架构）"
          ARCH=$(dpkg-deb --field "$DEB" Architecture)
          if [ "$ARCH" != "${{ matrix.deb_arch }}" ]; then
            echo "错误：control 架构为 $ARCH，期望 ${{ matrix.deb_arch }}" >&2
            exit 1
          fi
          echo "✓ 架构一致：$ARCH"
          echo "==> 内容完整性（关键路径必须存在）"
          LIST=$(dpkg-deb --fsys-tarfile "$DEB" | tar -t)
          for p in ./usr/bin/at-webserver \
                   ./etc/mt5700/config.json \
                   ./etc/mt5700/on-uplink.sh \
                   ./lib/systemd/system/at-webserver.service \
                   ./usr/share/doc/at-webserver/README.Debian; do
            echo "$LIST" | grep -qx "$p" || { echo "错误：包内缺少 $p" >&2; exit 1; }
            echo "✓ $p"
          done
          # WebUI 资源数量闸门：缺失说明前端未打进包
          echo "✓ WebUI 资源文件数：$(echo "$LIST" | grep -c 'usr/share/mt5700/webui')"
          # 不把 $DEB 写入 GITHUB_ENV：后续步骤用 `ls dist/*.deb` 重新定位，
          # 无需跨步骤传递。相对路径写入 env 文件会被指令解析器拒绝
          # （Invalid format 'dist/at-webserver_2.0.0-1_amd64.deb'）。
          echo "✓ 闸门全部通过"

      # ---------- 8 ----------
      - name: 日志归档（推送构建日志到 ci-logs 分支）
        if: always()
        continue-on-error: true
        env:
          DEB_ARCH_NAME: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          LOG_DIR="debian"
          LOG="debian-${DEB_ARCH_NAME}-$(date -u '+%Y%m%d-%H%M%S').txt"
          {
            echo "=== Debian 云编译构建日志 ==="
            echo "提交: ${{ github.sha }}"
            echo "分支/标签: ${{ github.ref }}"
            echo "架构: ${DEB_ARCH_NAME}"
            echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "--- 工具版本 ---"
            rustc --version || true
            cargo --version || true
            dpkg-deb --version | head -1 || true
            echo
            echo "--- 产物清单 ---"
            ls -lh dist/ 2>/dev/null || echo "(dist 为空)"
            echo
            echo "--- deb 元数据 ---"
            for d in dist/*.deb; do
              [ -f "$d" ] || continue
              dpkg-deb --field "$d" Package Version Architecture Depends
            done
          } | tee "$LOG"

          # 推送到 ci-logs 分支（不存在则创建）
          # 注意：仓库 .gitignore 含 `*.log`，日志文件必须用 `git add -f` 强制添加；
          # ci-logs 分支首次创建时 `git fetch origin ci-logs` 会以非 0 退出，需容错。
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ci-logs >/dev/null 2>&1; then
            git fetch origin ci-logs || true
            git checkout -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p "logs/$LOG_DIR"
          cp "$LOG" "logs/$LOG"
          # -f：绕过 .gitignore 的 *.log 规则
          git add -f "logs/$LOG"
          if ! git diff --cached --quiet; then
            git commit -m "ci(debian): ${DEB_ARCH_NAME} 构建日志 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 并发下 push 可能因 ref 竞争失败；日志已同时保留在 Actions 日志中，不阻断构建
            git push origin ci-logs || \
              echo "警告：日志推送冲突，本次仅保留在 Actions 运行日志中" >&2
          fi
          echo "==> 日志已保存：logs/$LOG"

      # ---------- 9 ----------
      - name: 产物归档（上传 Actions 构件）
        uses: actions/upload-artifact@v4
        with:
          name: at-webserver-deb-${{ matrix.deb_arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: 统一发布（汇总全部架构产物并发布 Release）
    needs: build
    runs-on: ubuntu-latest
    steps:
      # ---------- 10 ----------
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # ---------- 11 ----------
      - name: 下载全部架构产物
        uses: actions/download-artifact@v4
        with:
          pattern: at-webserver-deb-*
          path: dist-collected
          merge-multiple: true

      # ---------- 12 ----------
      - name: 产物汇总校验
        run: |
          set -euo pipefail
          echo "==> 收集到的 deb 产物"
          ls -lh dist-collected/
          COUNT=$(ls -1 dist-collected/*.deb | wc -l)
          [ "$COUNT" -ge 1 ] || { echo "错误：无 deb 产物" >&2; exit 1; }
          echo "共 $COUNT 个产物"
          echo "==> 逐个校验元数据"
          for d in dist-collected/*.deb; do
            echo "--- $(basename "$d") ---"
            dpkg-deb --field "$d" Package Version Architecture Depends
          done

      # ---------- 13 ----------
      - name: 版本号判定（标签优先，回退版本号拼接）
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "使用标签作为 Release 名：$TAG"
          else
            VER=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' src/rust/Cargo.toml | head -1)
            [ -n "$VER" ] || { echo "错误：无法从 Cargo.toml 解析版本" >&2; exit 1; }
            TAG="debian-v$VER"
            echo "使用版本号拼接 Release 名：$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ---------- 14 ----------
      - name: 生成发布说明
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          {
            echo "## at-webserver（Debian 独立版）$TAG"
            echo
            echo "MT5700M 5G 模组管理服务的 Debian 二进制包。安装后 systemd 托管，"
            echo "WebUI 与 HTTP API 默认监听 \`0.0.0.0:9000\`。"
            echo
            echo "### 产物"
            echo
            echo "| 文件 | 架构 |"
            echo "| --- | --- |"
            for d in dist-collected/*.deb; do
              A=$(dpkg-deb --field "$d" Architecture)
              echo "| \`$(basename "$d")\` | $A |"
            done
            echo
            echo "### 安装"
            echo
            echo '```bash'
            echo "# 按架构选包（如 arm64）"
            echo "sudo apt install ./at-webserver_*_arm64.deb"
            echo '```'
            echo
            echo "安装后浏览器访问 \`http://<设备IP>:9000\`。"
            echo
            echo "### 说明"
            echo
            echo "- 包内 \`/etc/mt5700/config.json\` 为 conffile，升级时保留用户修改。"
            echo "- 服务默认已 \`systemctl enable\`；未接模组时自动启动可能失败，属预期，"
            echo "  接入模组后执行 \`systemctl restart at-webserver\` 即可。"
            echo "- 完整变更说明见仓库 \`docs/release-notes/\`。"
          } > release-notes.md
          cat release-notes.md

      # ---------- 15 ----------
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          # 同名 Release 可能来自历史构建，先删后建，保证资产与本次代码一致
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "at-webserver $TAG（Debian deb 包）" \
            --notes-file release-notes.md \
            dist-collected/*.deb
          echo "==> Release 已发布：$TAG"
          gh release view "$TAG" --json tagName,name --jq '"  标签: " + .tagName + "\n  名称: " + .name'

      # ---------- 16 ----------
      - name: 发布结果校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          echo "==> Release 资产清单"
          gh release view "$TAG" --json assets --jq '.assets[] | "  " + .name + "  (" + (.size|tostring) + " B)"'
          N=$(gh release view "$TAG" --json assets --jq '.assets | length')
          [ "$N" -ge 1 ] || { echo "错误：Release 无资产" >&2; exit 1; }
          echo "✓ 共 $N 个资产"