name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Check shell syntax and USB detection
        run: |
          sh -n luci-app-mt5700m/root/etc/hotplug.d/usb/60-mt5700m
          sh -n luci-app-mt5700m/root/etc/init.d/at-webserver
          sh -n luci-app-mt5700m/root/etc/init.d/mt5700m-manager
          sh -n luci-app-mt5700m/root/etc/init.d/mt5700m-traffic
          sh -n luci-app-mt5700m/root/etc/hotplug.d/net/95-mt5700m-traffic
          sh -n luci-app-mt5700m/root/etc/uci-defaults/90-mt5700m
          sh -n luci-app-mt5700m/root/etc/uci-defaults/92-mt5700m-traffic
          sh -n luci-app-mt5700m/root/etc/uci-defaults/93-mt5700m-webui
          sh -n luci-app-mt5700m/htdocs/cgi-bin/at-ws-info
          sh -n luci-app-mt5700m/htdocs/cgi-bin/at-log-clear
          sh -n luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m
          sh -n luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m-traffic
          sh -n luci-app-mt5700m/root/usr/sbin/mt5700m-at
          sh -n luci-app-mt5700m/root/usr/sbin/mt5700m-manager
          sh -n luci-app-mt5700m/root/usr/sbin/mt5700m-traffic
          sh -n luci-app-mt5700m/root/usr/share/mt5700m/usb.sh
          sh luci-app-mt5700m/tests/test-usb-detection.sh
          sh luci-app-mt5700m/tests/test-temperature-cache.sh
      - name: Check executable service files
        run: |
          # ALL init.d scripts MUST be executable: procd only runs +x scripts.
          # A 0644 init script is silently skipped at boot (this exact bug
          # shipped in <=v2.3.31: /etc/init.d/at-webserver was 0644, so
          # at-server.py never started, ws://LAN_IP:8765 had no listener and
          # every realtime WebUI panel showed zeros).
          for f in luci-app-mt5700m/root/etc/init.d/*; do
            test -x "$f" || { echo "ERROR: init script not executable: $f" >&2; exit 1; }
          done
          # uhttpd requires +x on CGI scripts.
          for f in luci-app-mt5700m/htdocs/cgi-bin/*; do
            test -x "$f" || { echo "ERROR: CGI script not executable: $f" >&2; exit 1; }
          done
          test -x luci-app-mt5700m/root/usr/sbin/mt5700m-at
          test -x luci-app-mt5700m/root/usr/sbin/mt5700m-manager
          test -x luci-app-mt5700m/root/usr/sbin/mt5700m-traffic
          test -x luci-app-mt5700m/root/usr/bin/at-server.py
          test -x luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m
          test -x luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/hotplug.d/net/95-mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/hotplug.d/usb/60-mt5700m
          test -x luci-app-mt5700m/root/etc/uci-defaults/90-mt5700m
          test -x luci-app-mt5700m/root/etc/uci-defaults/92-mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/uci-defaults/93-mt5700m-webui
      - name: Check LuCI JavaScript syntax
        run: find luci-app-mt5700m/htdocs -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON metadata
        run: |
          jq empty luci-app-mt5700m/root/usr/share/luci/menu.d/luci-app-mt5700m.json
          jq empty luci-app-mt5700m/root/usr/share/rpcd/acl.d/luci-app-mt5700m.json
      - name: Validate translations
        run: msgfmt --check --check-format -o /dev/null luci-app-mt5700m/po/zh_Hans/mt5700m.po
