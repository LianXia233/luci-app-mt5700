name: OpenWrt 软件包云编译（apk + ipk）

# 云编译 OpenWrt 软件包：
#   - 25.12.x（当前稳定版，包管理器 apk）  → 产出 .apk
#   - 24.10.x（长期支持，opkg 包管理器）    → 产出 .ipk
#
# 架构矩阵（三档，覆盖两类 aarch64 命名）：
#   x86_64               x86/64           （软路由 / 虚拟机）
#   aarch64_cortex-a53   mediatek/filogic （MT798x；ARCH_PACKAGES 由 CPU_TYPE=cortex-a53 得出）
#   aarch64_generic      armsr/armv8      （CPU_TYPE 未定义；iStoreOS 25.x、Arm SystemReady 及
#                                          其它把 aarch64 命名为 generic 的固件）
#
# 为什么必须同时出 cortex-a53 与 generic：
#   apk 的架构是 <base>[_<variant>] 模型，variant 参与严格匹配。同一颗 Cortex-A53，
#   OpenWrt 目标里 CPU_TYPE=cortex-a53 时 ARCH_PACKAGES=aarch64_cortex-a53，
#   而 CPU_TYPE 未定义（如 armsr/armv8）时 ARCH_PACKAGES=aarch64_generic。
#   aarch64_cortex-a53 的包装到声明 aarch64_generic 的固件上会被 apk 拒绝：
#     error: uninstallable arch: aarch64_cortex-a53
#   反之亦然。这不是 CPU 不兼容（两者都是 ARMv8-A 指令集），而是元数据不匹配。
#
# 触发：push 到 main、打 v* 标签、或手动 workflow_dispatch
# 产物：每次编译成功后自动发布 GitHub Release，分**两条互不干扰**的通道
#   - 正式版（stable）：push 标签 v*，或手动派发时选 stable → tag 用标签名
#     （如 v1.29.0），同名则覆盖更新；会成为 GitHub 的 latest。
#   - 预览版（preview）：push main（开发中的默认路径），或手动派发时选 preview →
#     tag 为 preview-v<PKG_VERSION>-r<PKG_RELEASE>（如 preview-v1.29.0-r8），
#     带 Pre-release 标记。**不会**触碰正式版 Release，也不会抢占 latest。
#
# 为什么要分通道：main 上每次提交都会触发编译，若沿用「main 推送 → 覆盖 v<VERSION>」，
# 开发中的中间产物会直接盖掉用户正在用的正式版 —— 而正式版的资产版本往往落后于
# Makefile 的 PKG_RELEASE（正式版资产停在 r3 时，main 上已经是 r8 就很常见）。
# 预览版用 preview- 前缀带来两个额外好处：
#   ① 与正式版在 Releases 页面自然分开，各自标注；
#   ② 不匹配下方「清理历史 Release」的 ^v[0-9] 规则，因此发布预览版
#      **不会**把正式版挤出保留名额（这条是硬保护，不是靠配置约定）。
#
# 构建日志：不向仓库写入（不再产出 ci-logs-* 分支），仅保留在 Actions 运行日志中
#           （保留期由 GitHub 侧控制）

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道：preview=预览版（不影响正式版，默认）；stable=正式版（覆盖同名 v<版本>）'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - stable
      keep_releases:
        description: '正式版：发布后保留最近几个 v* Release，更早的自动删除（仅清理 Release 与资产，不动 git tag）'
        required: false
        default: '1'
        type: string
      keep_previews:
        description: '预览版：发布后保留最近几个 preview-* Release，更早的自动删除（正式版不参与计数）'
        required: false
        default: '3'
        type: string

permissions:
  contents: write

# 一次发布会同时触发两个 run（main 分支 push + tag push），两者 sha 相同。
# 并发会导致：① release job 对同一 tag 并发 delete+create 互相踩踏。
# 按 sha 归入同一并发组并排队（不取消），两个 run 串行执行即可消除竞争。
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译构建（${{ matrix.fmt }} · ${{ matrix.arch }}）
    runs-on: ubuntu-latest
    # stale=true 表示「本次提交已被后续提交取代」，供 release job 判断是否跳过。
    outputs:
      stale: ${{ steps.stale.outputs.stale }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- 25.12.x（apk，当前稳定版）----
          - image: x86_64-25.12.5
            arch: x86_64
            rust: x86_64-unknown-linux-musl
            ver: '25.12.5'
            target: x86/64
            fmt: apk
          - image: aarch64_cortex-a53-25.12.5
            arch: aarch64_cortex-a53
            rust: aarch64-unknown-linux-musl
            ver: '25.12.5'
            target: mediatek/filogic
            fmt: apk
          - image: aarch64_generic-25.12.5
            arch: aarch64_generic
            rust: aarch64-unknown-linux-musl
            ver: '25.12.5'
            target: armsr/armv8
            fmt: apk
          # ---- 24.10.x（opkg/ipk，长期支持）----
          - image: x86_64-24.10.8
            arch: x86_64
            rust: x86_64-unknown-linux-musl
            ver: '24.10.8'
            target: x86/64
            fmt: ipk
          - image: aarch64_cortex-a53-24.10.8
            arch: aarch64_cortex-a53
            rust: aarch64-unknown-linux-musl
            ver: '24.10.8'
            target: mediatek/filogic
            fmt: ipk
          - image: aarch64_generic-24.10.8
            arch: aarch64_generic
            rust: aarch64-unknown-linux-musl
            ver: '24.10.8'
            target: armsr/armv8
            fmt: ipk

    steps:
      - name: 检出仓库代码
        # v7.0.1：runs.using = node24（v5 为 node20，同样会触发 Node 20 弃用告警）
        uses: actions/checkout@v7.0.1

      - name: 环境准备（输出目录与构建参数）
        run: |
          mkdir -p out
          echo "==> 构建参数：OpenWrt ${{ matrix.ver }} / 架构 ${{ matrix.arch }} / 包格式 ${{ matrix.fmt }} / 目标 ${{ matrix.target }}"
          echo "==> Rust 目标三元组：${{ matrix.rust }}"
          echo "==> 工作目录：$(pwd)，SDK 镜像：openwrt/sdk:${{ matrix.image }}"

      # ------------------------------------------------------------------
      # 陈旧提交检查：连续推送会为每个中间 commit 各起一个 run
      #
      # 背景（真实故障）：批量改动用「一次一个文件」的方式推送时，每个文件都是
      # 一个独立 commit，push 事件逐 commit 触发 —— 24 个 run 排队，其中
      # 「改了一半」的中间 commit（例如删掉了 localtime::now_string 但调用方还没
      # 改成 nettime）编译必然失败，白白占用 6 个架构矩阵各跑一遍 SDK 编译。
      # 这些失败的红叉不是代码问题，纯粹是中间态。
      #
      # 处理：只有「仍是分支最新」的提交才真正构建；被后续提交取代的直接跳过。
      # tag 推送与手动 dispatch 不受影响（它们本来就是终态）。
      # ------------------------------------------------------------------
      - name: 陈旧提交检查（已被后续提交取代则跳过构建）
        id: stale
        run: |
          stale=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            head=$(git ls-remote https://github.com/${{ github.repository }} "refs/heads/${{ github.ref_name }}" 2>/dev/null | cut -f1)
            if [ -n "$head" ] && [ "$head" != "${{ github.sha }}" ]; then
              stale=true
              echo "==> 本提交已被 ${head} 取代，跳过构建（避免为中间态 commit 白跑一遍）"
            fi
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

      # 依赖安装与构建执行分为两个 SDK 容器运行：
      #   依赖安装阶段把 Rust 工具链与 zig 装进工具链卷（宿主机 .ci-toolchain 目录，
      #   容器内 TOOLCHAIN_DIR=/opt），构建执行阶段复用同一卷，无需重复下载工具链。
      # 注意：/opt 是脚本认得的「兜底」位，别把它当唯一约定——CNB 侧传的是
      # TOOLCHAIN_DIR=/work/.toolchain/<任务名>、OUT_DIR=/work/out/<任务名>。
      - name: 依赖安装（Rust 工具链 + zig 交叉链接器，SDK 容器内）
        if: steps.stale.outputs.stale != 'true'
        run: |
          set +e
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v "$PWD/.ci-toolchain:/opt" \
            -e TOOLCHAIN_DIR=/opt \
            -e SDK_BUILD_PHASE=deps \
            openwrt/sdk:${{ matrix.image }} \
            /work/scripts/sdk-build.sh "${{ matrix.arch }}" "${{ matrix.rust }}" "${{ matrix.ver }}" "${{ matrix.target }}" 2>&1 | tee deps.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "==> 依赖安装退出码: $rc"
          exit $rc

      - name: 构建执行（OpenWrt SDK 编译 LuCI 前端 + Rust 后端）
        if: steps.stale.outputs.stale != 'true'
        run: |
          set +e
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v "$PWD/.ci-toolchain:/opt" \
            -v "$PWD/out:/out" \
            -e OUT_DIR=/out \
            -e TOOLCHAIN_DIR=/opt \
            -e SDK_BUILD_PHASE=build \
            openwrt/sdk:${{ matrix.image }} \
            /work/scripts/sdk-build.sh "${{ matrix.arch }}" "${{ matrix.rust }}" "${{ matrix.ver }}" "${{ matrix.target }}" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "==> 构建执行退出码: $rc"
          exit $rc

      # 架构一致性闸门：脚本按 SDK 实际报告的 ARCH_PACKAGES 输出到 out/<真实架构>/，
      # 因此若 out/<矩阵期望架构>/ 不存在，说明镜像 tag 与矩阵登记不符。
      # 这一步把「发错架构的包」从「用户装不上」提前到「CI 直接失败」。
      - name: 产物校验（架构一致性闸门）
        if: steps.stale.outputs.stale != 'true'
        run: |
          set -e
          echo "==> out 目录实际结构："
          find out -maxdepth 2 -type f | sort || true
          if [ ! -f "out/${{ matrix.arch }}/ARCH.txt" ]; then
            echo "::error::SDK 实际架构与矩阵期望（${{ matrix.arch }}）不一致，拒绝继续"
            find out -mindepth 2 -name 'ARCH.txt' | while read -r f; do
              echo "  $(dirname "$f") -> $(cat "$f")"
            done
            exit 1
          fi
          echo "==> 架构核对通过："
          cat "out/${{ matrix.arch }}/ARCH.txt"

      - name: 产物校验（单包完整性与后端二进制闸门）
        if: steps.stale.outputs.stale != 'true'
        run: |
          set -e
          if [ -z "$(find "out/${{ matrix.arch }}" -type f -name 'luci-app-mt5700*' -not -name 'luci-i18n*' -print -quit)" ]; then
            echo "::error::缺少 luci-app-mt5700 主包（arch=${{ matrix.arch }} fmt=${{ matrix.fmt }}）"
            exit 1
          fi
          echo "==> out/${{ matrix.arch }} 产物："
          ls -la "out/${{ matrix.arch }}/"

          # 单包必须自带后端。OpenWrt apk 非标准 tar，workflow 侧做体积闸门：
          # 纯前端约 100-200KB，含 Rust 后端约 1MB+
          PKG=$(find "out/${{ matrix.arch }}" -type f -name 'luci-app-mt5700*' -not -name 'luci-i18n*' -print -quit)
          SZ=$(wc -c < "$PKG")
          echo "==> 主包 $(basename "$PKG") 大小 ${SZ} bytes"
          if [ "$SZ" -lt 500000 ]; then
            echo "::error::主包过小 (${SZ}B)，可能未并入 Rust 后端"
            exit 1
          fi
          echo "==> 体积校验通过（单包策略）"

      - name: 产物归档（上传 Actions 构件）
        if: steps.stale.outputs.stale != 'true'
        # v7：runs.using = node24。此前 v5 声明的是 node20，runner 已弃用 Node 20，
        # 每个 job 都会打印「Node.js 20 is deprecated … being forced to run on Node.js 24」
        # 告警。v6 起正式支持 node24（v7 为当前最新，仅追加了单文件直传能力，
        # name / path / if-no-files-found / retention-days 的输入语义不变）。
        # 与 download-artifact@v8 配套使用——两者的大版本号不同步，以各自 release 为准。
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.fmt }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          # 构件只在一次发布内流转（release job 立刻下载并发布），留 90 天是白占存储
          retention-days: 7

  # ---- 统一发布：每次编译成功后运行一次，汇总全部架构产物并上传 Release ----
  # 不能放在 build job 内：多个矩阵 job 并发发布同一 tag 的 Release 会 API 竞态，
  # 导致 Release 创建失败或资产互相覆盖。这里由 release job 串行汇总后再发布。
  # 资产统一加 <架构>- 前缀：不同架构的依赖包 basename 相同（如 libc-1.2.6-r5.apk），
  # 同名文件在同一 Release 内必然冲突。用 gh CLI 替代 softprops 避免元数据更新 404 竞态。
  release:
    name: 统一发布（汇总全部架构产物并发布 Release）
    needs: build
    # 构建被「陈旧提交」跳过时不能发布：没有产物，发布步骤必然失败
    if: needs.build.outputs.stale != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库代码（读取版本号）
        # v7.0.1：runs.using = node24，与 build job 保持一致
        uses: actions/checkout@v7.0.1

      - name: 解析发布版本号与通道
        id: ver
        env:
          CHANNEL_INPUT: ${{ github.event.inputs.channel || '' }}
        run: |
          set -e
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -1 | tr -d '[:space:]')
          REL=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -1 | tr -d '[:space:]')
          [ -n "$VER" ] || VER="0.0.0-dev"
          [ -n "$REL" ] || REL="0"

          # 通道判定：tag 推送恒为正式版；main 推送恒为预览版；手动派发按输入选择。
          # 之所以让 main 走预览版：main 上的提交是开发中间态，让它直接覆盖
          # v<VERSION> 会把用户正在用的正式版换掉（见文件头「为什么要分通道」）。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CHANNEL=stable
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            CHANNEL="${CHANNEL_INPUT:-preview}"
          else
            CHANNEL=preview
          fi

          if [ "$CHANNEL" = "stable" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VER}"; fi
            PRERELEASE=false
          else
            # 预览版 tag 带发行号：同一 PKG_VERSION 下每次 rN 递进都是一份独立产物，
            # 不会「同名覆盖」把上一次的预览版悄悄换掉；也保证 ^v[0-9] 规则不匹配它，
            # 从而不参与正式版的保留名额竞争。
            TAG="preview-v${VER}-r${REL}"
            PRERELEASE=true
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "release=${REL}" >> "$GITHUB_OUTPUT"
          echo "==> 发布通道: ${CHANNEL} / tag: ${TAG} / pre-release: ${PRERELEASE} (ref=${GITHUB_REF})"

      - name: 下载全部构建产物
        # v8：runs.using = node24，与 upload-artifact@v7 同为 Node 24 运行时。
        # pattern / merge-multiple / path 三个输入在 v8 中语义不变。
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*'
          path: out/
          merge-multiple: true

      - name: 产物平铺（附加架构前缀重命名）
        run: |
          mkdir -p dist
          while IFS= read -r f; do
            arch=$(basename "$(dirname "$f")")
            cp "$f" "dist/${arch}-$(basename "$f")"
          done < <(find out -type f \( -name '*.apk' -o -name '*.ipk' \) | sort)
          echo "==> 待发布文件："
          find dist -type f | sort

      # 发布一份架构选择指南：让用户可自行核对设备架构再选包，
      # 避免「架构看起来一致但装不上」这类问题反复出现。
      - name: 生成架构选择指南
        run: |
          cat > dist/ARCH-GUIDE.txt <<'EOF'
          luci-app-mt5700 架构选择指南
          ================================

          一、先确认设备声明的有效架构（不是 CPU 型号，也不是 apk --print-arch）

            apk 系统（OpenWrt 25.x / ImmortalWrt SNAPSHOT / iStoreOS 25.x 等）:
                cat /etc/apk/arch

            opkg 系统（OpenWrt 24.10 及更早）:
                cat /etc/openwrt_release | grep OPENWRT_ARCH
                opkg print-architecture

          注意：apk --print-arch 输出的是 apk 二进制自带的默认架构（常见为 aarch64），
          与 /etc/apk/arch 里用于安装校验的架构列表不是一回事。以 /etc/apk/arch 为准。

          二、按 /etc/apk/arch 的第一行选包

            aarch64_cortex-a53  ->  aarch64_cortex-a53-luci-app-mt5700-*.apk
            aarch64_generic     ->  aarch64_generic-luci-app-mt5700-*.apk
            x86_64              ->  x86_64-luci-app-mt5700-*.apk

          两者都是 ARMv8-A 指令集，二进制互相兼容；装不上只是元数据里的
          <variant> 不匹配，不是 CPU 不支持。

          三、常见报错对照

            error: uninstallable arch: aarch64_cortex-a53
              -> 设备声明的是 aarch64_generic，请改下 aarch64_generic 的包。
                 临时方案：把这行加进 /etc/apk/arch 后再安装（sysupgrade 后失效）：
                     echo aarch64_cortex-a53 >> /etc/apk/arch

            error: uninstallable arch: aarch64_generic
              -> 设备声明的是 aarch64_cortex-a53（如 ImmortalWrt 的 mediatek/filogic），
                 请改下 aarch64_cortex-a53 的包。

            error: uninstallable arch: all
              -> 语言包（PKGARCH=all）在极少数固件上才会遇到。实测 apk-tools 3.0.5
                 已把 OpenWrt 的 all 当作兼容架构，通常不会出现；确实遇到时补一行：
                     echo all >> /etc/apk/arch

            luci-app-mt5700 (no such package): required by: luci-i18n-mt5700-zh-cn[...]
              -> 不是架构问题：语言包声明依赖主包，必须与主包在同一条命令里一起安装。

          四、安装命令

            主包与语言包必须一起装（语言包声明依赖主包）：

            apk:
                apk add --allow-untrusted \
                    ./<arch>-luci-app-mt5700-*.apk \
                    ./<arch>-luci-i18n-mt5700-zh-cn-*.apk

            opkg:
                opkg install ./<arch>-luci-app-mt5700_*.ipk \
                             ./<arch>-luci-i18n-mt5700-zh-cn_*.ipk

            只需要英文界面时可以只装主包，此时不要再单独装语言包。

          五、安装前可先做零风险预演

            用 apk --simulate 走完整架构与依赖求解，但不真正安装：

                apk add --simulate --allow-untrusted ./<arch>-luci-app-mt5700-*.apk

            输出形如 "(1/1) Installing luci-app-mt5700 (1.12.5-r1)" 即表示
            架构与依赖都已通过；若报 uninstallable arch 则说明选错了架构。
          EOF
          # 去掉 heredoc 缩进，保持文本左对齐
          sed -i 's/^          //' dist/ARCH-GUIDE.txt
          cat dist/ARCH-GUIDE.txt

      - name: 发布完整性校验（6 组合主包 + 架构覆盖）
        run: |
          set -e
          ARCHES="x86_64 aarch64_cortex-a53 aarch64_generic"
          # 主包（前端+后端合一）必须覆盖全部 6 个构建组合（3 架构 × apk/ipk）
          count=$(find dist -type f -name '*-luci-app-mt5700*' -not -name '*luci-i18n*' | wc -l)
          echo "==> luci-app-mt5700 主包: ${count} 个"
          if [ "$count" -lt 6 ]; then
            echo "::error::主包仅有 ${count} 个（期望 6 个：3 架构 × apk/ipk），拒绝发布不完整的 Release"
            find dist -type f | sort
            exit 1
          fi
          # 架构覆盖：单包内含二进制，必须每个架构都有；apk 与 ipk 都要有
          for arch in $ARCHES; do
            for fmt in apk ipk; do
              f=$(find dist -type f -name "${arch}-luci-app-mt5700*.${fmt}" -not -name '*luci-i18n*' -print -quit)
              [ -n "$f" ] || { echo "::error::缺少 ${arch}-${fmt} 主包"; exit 1; }
              echo "==> 已覆盖 ${arch}/${fmt}: $(basename "$f")"
            done
          done
          # 语言包（PKGARCH=all）也应三架构齐备
          for arch in $ARCHES; do
            f=$(find dist -type f -name "${arch}-luci-i18n-mt5700-*.apk" -print -quit)
            [ -n "$f" ] || echo "::warning::缺少 ${arch} 的 apk 语言包"
          done

      - name: 清理同名旧 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --repo "${GITHUB_REPOSITORY}"
            echo "==> 已清理旧 Release ${TAG}，将重建"
          fi

      # Release 简介的取用顺序：
      #   1) docs/release-notes/<tag>.md —— 手写、简明，发版时顺手补一个小文件；
      #   2) CHANGELOG 该版本段落的裁剪版（只留分类小标题 + 每条首句）；
      #   3) GitHub 自动生成的提交列表。
      # 不用 --generate-notes 作首选：那只是提交列表，对使用者几乎没有信息量。
      - name: 撰写发布说明
        id: notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          PKG_REL: ${{ steps.ver.outputs.release }}
        run: |
          set -e
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -1 | tr -d '[:space:]')
          # 三段式拼装：HEADER（预览版专属说明） + BODY（变更摘要 + 安装命令） → NOTES。
          # 拆开是为了让预览版说明恒定排在最前，而不必改动下面已有的摘要生成逻辑。
          NOTES=/tmp/release-notes.md
          BODY=/tmp/release-body.md
          HEADER=/tmp/release-header.md
          : > "$BODY"
          : > "$HEADER"
          HANDWRITTEN="docs/release-notes/${TAG}.md"

          if [ -f "$HANDWRITTEN" ]; then
            echo "==> 使用手写发布摘要：$HANDWRITTEN"
            cp "$HANDWRITTEN" "$BODY"
          else
            SECTION=/tmp/changelog-section.md
            awk -v ver="$VER" '
              $0 ~ "^## v" ver "($| )" { flag = 1; next }
              flag && /^## / { exit }
              flag { print }
            ' CHANGELOG.md > "$SECTION"

            if [ -s "$SECTION" ]; then
              echo "::warning::未找到 $HANDWRITTEN，改用 CHANGELOG 裁剪摘要"
              grep -E '^(### |- )' "$SECTION" \
                | sed -E 's/^(- \*\*[^*]+\*\*: [^。]*。).*$/\1/' \
                | head -12 > "$BODY"
              echo "" >> "$BODY"
              echo "完整变更记录见 [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。" >> "$BODY"
            else
              echo "::warning::既无 $HANDWRITTEN 也无 CHANGELOG 段落，回退为自动生成的提交列表"
              rm -f "$BODY"
            fi
          fi

          if [ -s "$BODY" ]; then
            # 自动生成「当前版本 + 当前架构」的完整安装命令，URL 已经拼好可直接执行。
            # 默认给国内加速地址（前缀 https://gh.acg2.mom/），并说明如何还原为直连。
            RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
            MIRROR="https://gh.acg2.mom"
            MIRRORED="${MIRROR}/${RELEASE_URL}"
            {
              echo ""
              echo "---"
              echo ""
              echo "## 安装（复制即用，${TAG}）"
              echo ""
              echo '先确认设备架构：`cat /etc/apk/arch`；opkg 系统用 `grep OPENWRT_ARCH /etc/openwrt_release`。'
              echo ""
              # 同一架构给出两套完整命令：国内加速版与直连版，按网络情况任选一条
              emit_cmd() {
                cbase="$1"; cmain="$2"; ci18n="$3"
                if [ -n "$ci18n" ]; then
                  echo "wget -O /tmp/mt5700.apk \"${cbase}/${cmain##*/}\" \\"
                  echo "  && wget -O /tmp/mt5700-i18n.apk \"${cbase}/${ci18n##*/}\" \\"
                  echo "  && apk add --allow-untrusted /tmp/mt5700.apk /tmp/mt5700-i18n.apk"
                else
                  echo "wget -O /tmp/mt5700.apk \"${cbase}/${cmain##*/}\" \\"
                  echo "  && apk add --allow-untrusted /tmp/mt5700.apk"
                fi
              }
              for a in x86_64 aarch64_cortex-a53 aarch64_generic; do
                MAIN=$(find dist -maxdepth 1 -type f -name "${a}-luci-app-mt5700-*.apk" -print -quit)
                [ -n "$MAIN" ] || continue
                I18N=$(find dist -maxdepth 1 -type f -name "${a}-luci-i18n-mt5700-*.apk" -print -quit)
                case "$a" in
                  x86_64) NOTE="x86 软路由 / 虚拟机" ;;
                  aarch64_cortex-a53) NOTE="ImmortalWrt、OpenWrt mediatek-filogic" ;;
                  aarch64_generic) NOTE="iStoreOS 25.x、Arm SystemReady 等" ;;
                  *) NOTE="" ;;
                esac
                echo "### ${a}（${NOTE}）"
                echo ""
                echo "**国内加速（推荐，前缀 \`${MIRROR}/\`）**"
                echo ""
                echo '```sh'
                emit_cmd "$MIRRORED" "$MAIN" "$I18N"
                echo '```'
                echo ""
                echo "**直连（不带前缀）**"
                echo ""
                echo '```sh'
                emit_cmd "$RELEASE_URL" "$MAIN" "$I18N"
                echo '```'
                echo ""
              done
              echo "> 以上两套命令效果相同，按网络情况任选一条；加速版只是把 GitHub 原始 URL 前置了 \`${MIRROR}/\`。"
              echo ""
              echo "### 全部软件包下载链接"
              echo ""
              echo "每个架构都有 4 个包（主包 / 语言包 × apk / ipk），全部列出："
              echo ""
              echo "| 架构 | 包 | apk（加速 / 直连） | ipk（加速 / 直连） |"
              echo "|:--|:--|:--|:--|"
              for a in x86_64 aarch64_cortex-a53 aarch64_generic; do
                for pair in "luci-app-mt5700:主包" "luci-i18n-mt5700:语言包"; do
                  p="${pair%%:*}"
                  label="${pair##*:}"
                  APK=$(find dist -maxdepth 1 -type f -name "${a}-${p}*.apk" -print -quit)
                  IPK=$(find dist -maxdepth 1 -type f -name "${a}-${p}*.ipk" -print -quit)
                  acell="-"
                  icell="-"
                  [ -n "$APK" ] && acell="[加速](${MIRRORED}/${APK##*/}) · [直连](${RELEASE_URL}/${APK##*/})"
                  [ -n "$IPK" ] && icell="[加速](${MIRRORED}/${IPK##*/}) · [直连](${RELEASE_URL}/${IPK##*/})"
                  echo "| ${a} | ${label} | ${acell} | ${icell} |"
                done
              done
              echo ""
              echo "另有 \`ARCH-GUIDE.txt\`（架构选择与报错对照）。"
              echo "> opkg 系统（OpenWrt 24.10 及更早）：把 \`.apk\` 换成 \`.ipk\`，命令改为 \`opkg install\`。"
              echo "> 只想先验证不安装：在 \`apk add\` 后加 \`--simulate\`。报错对照见资产 \`ARCH-GUIDE.txt\`。"
            } >> "$BODY"
          fi

          # ---- 头部：预览版专属说明（正式版为空，摘要格式与原先完全一致）----
          # 这段是预览版唯一「必须醒目」的信息：把「这是测试版本、别拿去生产」放在
          # Releases 页面的第一行，避免用户把自动构建产物当成正式版装到在网设备上。
          if [ "$CHANNEL" = "preview" ]; then
            SHORT_SHA="${GITHUB_SHA:0:7}"
            {
              echo "> ## ⚠️ 测试版本 · 仅供验证，请勿用于生产环境"
              echo ">"
              echo "> 本包由 \`main\` 分支**自动构建**，**不是**正式发布版本：可能包含未完成的改动、"
              echo "> 尚未实机验证的修复，也可能被下一次构建随时取代。"
              echo ">"
              echo "> - **适用**：验证最新改动、复现问题、给开发反馈。"
              echo "> - **不适用**：生产环境 / 长期运行的设备。要稳定版本请用正式版"
              echo ">   [\`v${VER}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VER})。"
              echo "> - 本预览版**不会**替换正式版，也**不会**成为仓库的 latest。"
              echo ">"
              echo "> ### 构建信息"
              echo ">"
              echo "> | 项 | 值 |"
              echo "> |:--|:--|"
              echo "> | 来源分支 | \`${GITHUB_REF_NAME}\` |"
              echo "> | 来源提交 | [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
              echo "> | 版本 | \`PKG_VERSION=${VER}\` / \`PKG_RELEASE=${PKG_REL}\` |"
              echo "> | 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
              echo "> | 构建矩阵 | 3 架构 ×（apk · OpenWrt 25.12.5 / ipk · OpenWrt 24.10.8） |"
              echo ">"
              echo "> ⚠️ 装之前请先备份配置（\`sysupgrade -b\`）；测试版不建议直接覆盖在网设备。"
              echo "> 安装方式与正式版完全相同（见下方「安装」）。"
              echo ""
            } >> "$HEADER"
          fi

          # ---- 拼装：有摘要时 HEADER+BODY；只有头部时也要保留头部（预览版标识不能丢）----
          if [ -s "$BODY" ]; then
            cat "$HEADER" "$BODY" > "$NOTES"
            echo "body_file=$NOTES" >> "$GITHUB_OUTPUT"
          elif [ -s "$HEADER" ]; then
            cp "$HEADER" "$NOTES"
            echo "本次构建的提交列表见 [Actions 运行日志](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})。" >> "$NOTES"
            echo "body_file=$NOTES" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$NOTES" ]; then
            echo "==> Release 简介（$(wc -l < "$NOTES") 行）："
            cat "$NOTES"
          fi

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          mapfile -t FILES < <(find dist -type f | sort)
          BODY="${{ steps.notes.outputs.body_file }}"
          # 预览版加 --prerelease：Releases 页面单独打 Pre-release 标记，而且
          # **不会抢占 latest** —— latest 只认最新的「非草稿且非预发布」Release，
          # 所以正式版 v<VERSION> 的 latest 身份在这里是天然受保护的。
          FLAGS=(--repo "${GITHUB_REPOSITORY}")
          TITLE="AT WebServer ${TAG}"
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
            # 标题同样带警示：Releases 列表页一眼能看出这是测试版，不是正式版
            TITLE="⚠️ AT WebServer ${TAG}（测试版本 · 仅供验证）"
          fi
          if [ -n "$BODY" ] && [ -s "$BODY" ]; then
            gh release create "$TAG" "${FILES[@]}" \
              "${FLAGS[@]}" \
              --notes-file "$BODY" \
              --title "${TITLE}"
          else
            gh release create "$TAG" "${FILES[@]}" \
              "${FLAGS[@]}" \
              --generate-notes \
              --title "${TITLE}"
          fi
          echo "==> Release ${TAG} 已发布（通道 ${CHANNEL}），资产 ${#FILES[@]} 个"

      # 每个版本 13 个资产、约 9 MB，历史 Release 会一路堆积。
      # 只删 **Release 与其资产**，不动 git tag —— tag 指向提交，删了会让
      # 「某版本对应哪次提交」无从追溯，而 Release 只是可重发的下载入口。
      # 分**两组独立**清理，互不计入对方名额：
      #   正式版：tag 形如 v1.29.0，只保留最近 KEEP_RELEASES 个；
      #   预览版：tag 形如 preview-v1.29.0-r8，只保留最近 KEEP_PREVIEWS 个。
      # 两组正则各自只匹配本组（^v[0-9] 匹配不到 preview- 前缀），因此
      # **发布预览版永远不会把正式版挤出保留名额** —— 这是硬保护，不是靠配置约定。
      # 两组共用两条保护：① 只认本组前缀（debian-v2.0.1 这类另一条发布线的产物不参与）；
      #                   ② latest 那个即使超出保留数也保留（它可能不是时间上最新的）。
      - name: 清理历史 Release（正式版 / 预览版各保留最近若干个）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: ${{ github.event.inputs.keep_releases || '1' }}
          KEEP_PREVIEWS: ${{ github.event.inputs.keep_previews || '3' }}
        run: |
          set -e
          cleanup_group() {
            local regex="$1" keep="$2" label="$3"
            mapfile -t ROWS < <(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
              --json tagName,isLatest,createdAt \
              --jq "map(select(.tagName | test(\"${regex}\")))
                    | sort_by(.createdAt) | reverse
                    | .[] | \"\(.tagName)\t\(.isLatest)\"")
            echo "==> ${label} 现有 ${#ROWS[@]} 个，本轮保留最近 ${keep} 个"
            local idx=0
            for row in "${ROWS[@]}"; do
              idx=$((idx + 1))
              tag="${row%%$'\t'*}"
              is_latest="${row##*$'\t'}"
              if [ "$idx" -le "$keep" ]; then
                echo "  [保留] ${tag}（第 ${idx} 新的，在保留数内）"
                continue
              fi
              if [ "$is_latest" = "true" ]; then
                echo "  [保留] ${tag}（当前 latest，即使超出保留数）"
                continue
              fi
              echo "  [删除] ${tag}"
              gh release delete "$tag" --yes --repo "${GITHUB_REPOSITORY}" \
                || echo "::warning::删除 ${tag} 失败，已跳过不影响发布"
            done
          }
          cleanup_group '^v[0-9]' "$KEEP_RELEASES" '正式版 v* Release'
          cleanup_group '^preview-v' "$KEEP_PREVIEWS" '预览版 preview-* Release'
