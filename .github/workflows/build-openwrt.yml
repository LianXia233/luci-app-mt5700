name: Build OpenWrt packages (apk + ipk)

# 云编译 OpenWrt 软件包：
#   - 最新主线（main snapshot，OpenWrt 24.10+ 包管理器 apk）→ 产出 .apk
#   - 老版本 23.05（opkg 包管理器）→ 产出 .ipk
# 架构矩阵：x86_64 / aarch64_cortex-a53（主线 apk + 老版 23.05 ipk）
# 触发：push 到 main、打 v* 标签、或手动 workflow_dispatch
# 产物：Actions 页面 Artifacts 下载；打标签时自动发布到 GitHub Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- 最新主线 → .apk ----
          # 镜像 tag 格式：openwrt/sdk:<架构>-<版本>（已用 Docker Hub API 核实）
          - image: x86_64-main
            arch: x86_64
            rust: x86_64-unknown-linux-musl
            ver: main
            target: x86/64
            fmt: apk
          - image: aarch64_cortex-a53-main
            arch: aarch64_cortex-a53
            rust: aarch64-unknown-linux-musl
            ver: main
            target: qualcommax/ipq50xx
            fmt: apk
          # ---- 老版本 23.05 → .ipk ----
          - image: x86_64-23.05.5
            arch: x86_64
            rust: x86_64-unknown-linux-musl
            ver: 23.05.5
            target: x86/64
            fmt: ipk
          - image: aarch64_cortex-a53-23.05.5
            arch: aarch64_cortex-a53
            rust: aarch64-unknown-linux-musl
            ver: 23.05.5
            target: mediatek/filogic
            fmt: ipk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in OpenWrt SDK container
        run: |
          mkdir -p out
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v "$PWD/out:/out" \
            openwrt/sdk:${{ matrix.image }} \
            /work/scripts/sdk-build.sh "${{ matrix.arch }}" "${{ matrix.rust }}" "${{ matrix.ver }}" "${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fmt }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  # ---- 统一发布：仅打 v* 标签时运行一次，汇总全部架构产物 ----
  # 不能放在 build job 内：4 个矩阵 job 并发发布同一 tag 的 Release 会 API 竞态，
  # 导致 Release 创建失败或资产互相覆盖。这里由 release job 串行汇总后再发布。
  # 资产统一加 <架构>- 前缀：不同架构的依赖包 basename 相同（如 libc-1.2.6-r5.apk），
  # 同名文件在同一 Release 内必然冲突。用 gh CLI 替代 softprops 避免元数据更新 404 竞态。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: out/
          merge-multiple: true

      - name: Flatten packages with arch prefix
        run: |
          mkdir -p dist
          while IFS= read -r f; do
            arch=$(basename "$(dirname "$f")")
            cp "$f" "dist/${arch}-$(basename "$f")"
          done < <(find out -type f \( -name '*.apk' -o -name '*.ipk' \) | sort)
          echo "==> 待发布文件："
          find dist -type f | sort

      - name: Clean up previous draft release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes --repo "${GITHUB_REPOSITORY}"
            echo "==> 已清理旧 Release ${GITHUB_REF_NAME}"
          fi

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t FILES < <(find dist -type f | sort)
          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "AT WebServer ${GITHUB_REF_NAME}"
          echo "==> Release ${GITHUB_REF_NAME} 已发布，资产 ${#FILES[@]} 个"
