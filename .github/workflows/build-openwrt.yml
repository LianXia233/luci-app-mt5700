name: Build OpenWrt packages (apk + ipk)

# 云编译 OpenWrt 软件包：
#   - 25.12.x（当前稳定版，包管理器 apk）  → 产出 .apk
#   - 24.10.x（长期支持，opkg 包管理器）    → 产出 .ipk
#
# 架构矩阵（三档，覆盖两类 aarch64 命名）：
#   x86_64               x86/64           （软路由 / 虚拟机）
#   aarch64_cortex-a53   mediatek/filogic （MT798x；ARCH_PACKAGES 由 CPU_TYPE=cortex-a53 得出）
#   aarch64_generic      armsr/armv8      （CPU_TYPE 未定义；iStoreOS 25.x、Arm SystemReady 及
#                                          其它把 aarch64 命名为 generic 的固件）
#
# 为什么必须同时出 cortex-a53 与 generic：
#   apk 的架构是 <base>[_<variant>] 模型，variant 参与严格匹配。同一颗 Cortex-A53，
#   OpenWrt 目标里 CPU_TYPE=cortex-a53 时 ARCH_PACKAGES=aarch64_cortex-a53，
#   而 CPU_TYPE 未定义（如 armsr/armv8）时 ARCH_PACKAGES=aarch64_generic。
#   aarch64_cortex-a53 的包装到声明 aarch64_generic 的固件上会被 apk 拒绝：
#     error: uninstallable arch: aarch64_cortex-a53
#   反之亦然。这不是 CPU 不兼容（两者都是 ARMv8-A 指令集），而是元数据不匹配。
#
# 触发：push 到 main、打 v* 标签、或手动 workflow_dispatch
# 产物：每次编译成功后自动发布 GitHub Release
#   - 标签推送 → 使用该标签名（如 v1.12.5）
#   - main 推送 → 使用 Makefile 的 PKG_VERSION（如 v1.12.5），同名则覆盖更新

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# 一次发布会同时触发两个 run（main 分支 push + tag push），两者 sha 相同。
# 并发会导致：① ci-logs-* 分支 force push 撞 ref CAS；
#            ② release job 对同一 tag 并发 delete+create 互相踩踏。
# 按 sha 归入同一并发组并排队（不取消），两个 run 串行执行即可消除竞争。
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- 25.12.x（apk，当前稳定版）----
          - image: x86_64-25.12.5
            arch: x86_64
            rust: x86_64-unknown-linux-musl
            ver: '25.12.5'
            target: x86/64
            fmt: apk
          - image: aarch64_cortex-a53-25.12.5
            arch: aarch64_cortex-a53
            rust: aarch64-unknown-linux-musl
            ver: '25.12.5'
            target: mediatek/filogic
            fmt: apk
          - image: aarch64_generic-25.12.5
            arch: aarch64_generic
            rust: aarch64-unknown-linux-musl
            ver: '25.12.5'
            target: armsr/armv8
            fmt: apk
          # ---- 24.10.x（opkg/ipk，长期支持）----
          - image: x86_64-24.10.8
            arch: x86_64
            rust: x86_64-unknown-linux-musl
            ver: '24.10.8'
            target: x86/64
            fmt: ipk
          - image: aarch64_cortex-a53-24.10.8
            arch: aarch64_cortex-a53
            rust: aarch64-unknown-linux-musl
            ver: '24.10.8'
            target: mediatek/filogic
            fmt: ipk
          - image: aarch64_generic-24.10.8
            arch: aarch64_generic
            rust: aarch64-unknown-linux-musl
            ver: '24.10.8'
            target: armsr/armv8
            fmt: ipk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in OpenWrt SDK container
        run: |
          mkdir -p out
          set +e
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v "$PWD/out:/out" \
            openwrt/sdk:${{ matrix.image }} \
            /work/scripts/sdk-build.sh "${{ matrix.arch }}" "${{ matrix.rust }}" "${{ matrix.ver }}" "${{ matrix.target }}" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "==> docker run 退出码: $rc"
          exit $rc

      # 架构一致性闸门：脚本按 SDK 实际报告的 ARCH_PACKAGES 输出到 out/<真实架构>/，
      # 因此若 out/<矩阵期望架构>/ 不存在，说明镜像 tag 与矩阵登记不符。
      # 这一步把「发错架构的包」从「用户装不上」提前到「CI 直接失败」。
      - name: Verify SDK-reported arch matches matrix
        run: |
          set -e
          echo "==> out 目录实际结构："
          find out -maxdepth 2 -type f | sort || true
          if [ ! -f "out/${{ matrix.arch }}/ARCH.txt" ]; then
            echo "::error::SDK 实际架构与矩阵期望（${{ matrix.arch }}）不一致，拒绝继续"
            find out -mindepth 2 -name 'ARCH.txt' | while read -r f; do
              echo "  $(dirname "$f") -> $(cat "$f")"
            done
            exit 1
          fi
          echo "==> 架构核对通过："
          cat "out/${{ matrix.arch }}/ARCH.txt"

      # 构建日志对排查至关重要：Actions 日志下载受网络策略限制时，
      # 把日志提交到 ci-logs-<fmt>-<arch> 分支，便于离线取回。
      - name: Publish build log branch
        if: always()
        # 日志归档是辅助能力：多个 run 并发向同一 ci-logs-* 分支 force push
        # 时会被 git ref CAS 拒绝（cannot lock ref ... is at X but expected Y），
        # 失败不应阻断已生成的产物交付，否则会连带跳过 Release。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          BR="ci-logs-${{ matrix.fmt }}-${{ matrix.arch }}"
          git checkout --orphan "$BR"
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p logs
          cp build.log "logs/build.log" 2>/dev/null || true
          cp "out/${{ matrix.arch }}/ARCH.txt" "logs/ARCH.txt" 2>/dev/null || true
          find out -type f | sort > logs/artifacts.txt 2>/dev/null || true
          git add -f logs
          git commit -m "ci log ${{ matrix.fmt }}-${{ matrix.arch }} run ${{ github.run_id }}"
          git push --force origin "HEAD:$BR"

      - name: Verify single package bundle
        run: |
          set -e
          if [ -z "$(find "out/${{ matrix.arch }}" -type f -name 'luci-app-mt5700*' -not -name 'luci-i18n*' -print -quit)" ]; then
            echo "::error::缺少 luci-app-mt5700 主包（arch=${{ matrix.arch }} fmt=${{ matrix.fmt }}）"
            exit 1
          fi
          echo "==> out/${{ matrix.arch }} 产物："
          ls -la "out/${{ matrix.arch }}/"

          # 单包必须自带后端。OpenWrt apk 非标准 tar，workflow 侧做体积闸门：
          # 纯前端约 100-200KB，含 Rust 后端约 1MB+
          PKG=$(find "out/${{ matrix.arch }}" -type f -name 'luci-app-mt5700*' -not -name 'luci-i18n*' -print -quit)
          SZ=$(wc -c < "$PKG")
          echo "==> 主包 $(basename "$PKG") 大小 ${SZ} bytes"
          if [ "$SZ" -lt 500000 ]; then
            echo "::error::主包过小 (${SZ}B)，可能未并入 Rust 后端"
            exit 1
          fi
          echo "==> 体积校验通过（单包策略）"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fmt }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  # ---- 统一发布：每次编译成功后运行一次，汇总全部架构产物并上传 Release ----
  # 不能放在 build job 内：多个矩阵 job 并发发布同一 tag 的 Release 会 API 竞态，
  # 导致 Release 创建失败或资产互相覆盖。这里由 release job 串行汇总后再发布。
  # 资产统一加 <架构>- 前缀：不同架构的依赖包 basename 相同（如 libc-1.2.6-r5.apk），
  # 同名文件在同一 Release 内必然冲突。用 gh CLI 替代 softprops 避免元数据更新 404 竞态。
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (read PKG_VERSION)
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -1 | tr -d '[:space:]')
            [ -n "$VER" ] || VER="0.0.0-dev"
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "==> 发布版本: ${TAG} (ref=${GITHUB_REF})"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: out/
          merge-multiple: true

      - name: Flatten packages with arch prefix
        run: |
          mkdir -p dist
          while IFS= read -r f; do
            arch=$(basename "$(dirname "$f")")
            cp "$f" "dist/${arch}-$(basename "$f")"
          done < <(find out -type f \( -name '*.apk' -o -name '*.ipk' \) | sort)
          echo "==> 待发布文件："
          find dist -type f | sort

      # 发布一份架构选择指南：让用户可自行核对设备架构再选包，
      # 避免「架构看起来一致但装不上」这类问题反复出现。
      - name: Generate arch guide
        run: |
          cat > dist/ARCH-GUIDE.txt <<'EOF'
          luci-app-mt5700 架构选择指南
          ================================

          一、先确认设备声明的有效架构（不是 CPU 型号，也不是 apk --print-arch）

            apk 系统（OpenWrt 25.x / ImmortalWrt SNAPSHOT / iStoreOS 25.x 等）:
                cat /etc/apk/arch

            opkg 系统（OpenWrt 24.10 及更早）:
                cat /etc/openwrt_release | grep OPENWRT_ARCH
                opkg print-architecture

          注意：apk --print-arch 输出的是 apk 二进制自带的默认架构（常见为 aarch64），
          与 /etc/apk/arch 里用于安装校验的架构列表不是一回事。以 /etc/apk/arch 为准。

          二、按 /etc/apk/arch 的第一行选包

            aarch64_cortex-a53  ->  aarch64_cortex-a53-luci-app-mt5700-*.apk
            aarch64_generic     ->  aarch64_generic-luci-app-mt5700-*.apk
            x86_64              ->  x86_64-luci-app-mt5700-*.apk

          两者都是 ARMv8-A 指令集，二进制互相兼容；装不上只是元数据里的
          <variant> 不匹配，不是 CPU 不支持。

          三、常见报错对照

            error: uninstallable arch: aarch64_cortex-a53
              -> 设备声明的是 aarch64_generic，请改下 aarch64_generic 的包。
                 临时方案：把这行加进 /etc/apk/arch 后再安装（sysupgrade 后失效）：
                     echo aarch64_cortex-a53 >> /etc/apk/arch

            error: uninstallable arch: aarch64_generic
              -> 设备声明的是 aarch64_cortex-a53（如 ImmortalWrt 的 mediatek/filogic），
                 请改下 aarch64_cortex-a53 的包。

            error: uninstallable arch: all
              -> 语言包（PKGARCH=all）在极少数固件上才会遇到。实测 apk-tools 3.0.5
                 已把 OpenWrt 的 all 当作兼容架构，通常不会出现；确实遇到时补一行：
                     echo all >> /etc/apk/arch

            luci-app-mt5700 (no such package): required by: luci-i18n-mt5700-zh-cn[...]
              -> 不是架构问题：语言包声明依赖主包，必须与主包在同一条命令里一起安装。

          四、安装命令

            主包与语言包必须一起装（语言包声明依赖主包）：

            apk:
                apk add --allow-untrusted \
                    ./<arch>-luci-app-mt5700-*.apk \
                    ./<arch>-luci-i18n-mt5700-zh-cn-*.apk

            opkg:
                opkg install ./<arch>-luci-app-mt5700_*.ipk \
                             ./<arch>-luci-i18n-mt5700-zh-cn_*.ipk

            只需要英文界面时可以只装主包，此时不要再单独装语言包。

          五、安装前可先做零风险预演

            用 apk --simulate 走完整架构与依赖求解，但不真正安装：

                apk add --simulate --allow-untrusted ./<arch>-luci-app-mt5700-*.apk

            输出形如 "(1/1) Installing luci-app-mt5700 (1.12.5-r1)" 即表示
            架构与依赖都已通过；若报 uninstallable arch 则说明选错了架构。
          EOF
          # 去掉 heredoc 缩进，保持文本左对齐
          sed -i 's/^          //' dist/ARCH-GUIDE.txt
          cat dist/ARCH-GUIDE.txt

      - name: Verify dist completeness
        run: |
          set -e
          ARCHES="x86_64 aarch64_cortex-a53 aarch64_generic"
          # 主包（前端+后端合一）必须覆盖全部 6 个构建组合（3 架构 × apk/ipk）
          count=$(find dist -type f -name '*-luci-app-mt5700*' -not -name '*luci-i18n*' | wc -l)
          echo "==> luci-app-mt5700 主包: ${count} 个"
          if [ "$count" -lt 6 ]; then
            echo "::error::主包仅有 ${count} 个（期望 6 个：3 架构 × apk/ipk），拒绝发布不完整的 Release"
            find dist -type f | sort
            exit 1
          fi
          # 架构覆盖：单包内含二进制，必须每个架构都有；apk 与 ipk 都要有
          for arch in $ARCHES; do
            for fmt in apk ipk; do
              f=$(find dist -type f -name "${arch}-luci-app-mt5700*.${fmt}" -not -name '*luci-i18n*' -print -quit)
              [ -n "$f" ] || { echo "::error::缺少 ${arch}-${fmt} 主包"; exit 1; }
              echo "==> 已覆盖 ${arch}/${fmt}: $(basename "$f")"
            done
          done
          # 语言包（PKGARCH=all）也应三架构齐备
          for arch in $ARCHES; do
            f=$(find dist -type f -name "${arch}-luci-i18n-mt5700-*.apk" -print -quit)
            [ -n "$f" ] || echo "::warning::缺少 ${arch} 的 apk 语言包"
          done

      - name: Clean up previous release (same tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --repo "${GITHUB_REPOSITORY}"
            echo "==> 已清理旧 Release ${TAG}，将重建"
          fi

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          mapfile -t FILES < <(find dist -type f | sort)
          gh release create "$TAG" "${FILES[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "AT WebServer ${TAG}"
          echo "==> Release ${TAG} 已发布，资产 ${#FILES[@]} 个"
