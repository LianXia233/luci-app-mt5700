name: Build OpenWrt packages (apk + ipk)

# 云编译 OpenWrt 软件包：
#   - 最新主线（main snapshot，OpenWrt 24.10+ 包管理器 apk）→ 产出 .apk
#   - 老版本 23.05（opkg 包管理器）→ 产出 .ipk
# 架构矩阵：**只出 aarch64_cortex-a53**（主线 apk + 老版 23.05 ipk）。
# ★ 2026-09-28 裁减：原先还编 x86_64 两个组合。本插件是 CPE 上控制 5G 模组的，
#   目标机全是 aarch64（MT7987A / qualcommax 这类），x86 产物没有任何用户 ——
#   留着只是让每次推送多烧一倍机时、并把 Release 资产翻倍、还让"按架构选包"变复杂。
#   若日后真需要 x86，把下面两条 include 加回去，并同步改 Verify dist completeness
#   里的期望值（那里按架构 × 包格式逐个断言覆盖）。
# 触发：push 到 main、打 v* 标签、或手动 workflow_dispatch
# 另加 pull_request：合并前先跑 rust-check（见该 job 的说明）。
# 注意：PR 只跑检查，不跑打包、更不会发布 Release（build/release 两个 job 都有条件）。
# 产物：**每次编译成功后自动发布 GitHub Release**
#   - 标签推送 → 使用该标签名（如 v1.2.0）
#   - main 推送 → 使用 Makefile 的 PKG_VERSION（如 v1.2.0），同名则覆盖更新

# ★ 2026-09-28：**关闭 push 到 main 的自动打包**（用户要求）。
#   本仓库日常是「改一行也推一次」的高频迭代，而每次打包要跑两个 aarch64 docker
#   组合（实测约 5 分钟墙钟 / 8 个计费分钟），绝大多数推送只是中间状态、产物没人要。
#   现在 push 到 main **只跑 rust-check / contract-check**（几十秒），不再打包、不再发 Release。
#   【需要产物时】用这两种方式之一：
#     · 手动 workflow_dispatch
#     · 打 v* 标签（发版，仍会自动打包并发布 Release）
#   要恢复「push 即打包」，把下面 push 段的 `branches: [ main ]` 加回来，
#   并把 build 的 if 改回 `github.event_name != 'pull_request' && needs.needs_code.outputs.code == 'true'`。
on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# ★ 2026-09-28 新增（用户反馈「频繁推送非常浪费时间」）：
#   原来没有 concurrency —— 每次推送到 main 都排一个**数小时**的 docker 打包，
#   前一个还在跑也不取消，于是几次推送叠着一起烧机时。
#   group 用 workflow + ref：同一分支上的新推送会**取消上一次未完成的运行**；
#   tag 推送的 ref 各不相同（refs/tags/v1.2.0），所以各版本的构建**不会互相取消**——
#   这正是我们要的：main 上只保留最新一次，发布的 tag 一律跑完。
#   注意 rust-check / contract-check 也在这个 workflow 里，它们只要几十秒；
#   取消旧的 main 运行时连它们一起取消，但新的一次会立刻重跑，不影响把关。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---- 编译闸门 ----
  # 为什么单独要这一条：打包编译只会构建 lib/bin，测试代码（#[cfg(test)]）平时根本
  # 不参与，写错了 SDK 编译照样过 —— 曾经就有一批测试代码的编译错误这样进了 main。
  # `cargo check --all-targets` 把测试目标也检查一遍，几十秒出结果，
  # 不必等两个矩阵的 docker 打包跑完才知道挂了。
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 Rust 工具链
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cargo --version

      - name: cargo check（含测试代码）
        working-directory: src/rust
        run: cargo check --all-targets

  # ---- 契约测试闸门 ----
  # 为什么单独要这一条：40 个 JS 契约测试 + verify-guards.py 此前在 CI 里一次都没跑过，
  # 只在本地手工跑。它们守的恰恰是「编译能过、真机会炸」的那一类：
  # APDU 时序与超时恢复、init.d 的 start/reload 幂等、行尾必须 LF、三处版本号一致、
  # 以及「守卫本身会不会真的判红」。cargo check 对这些一无所知。
  # 与 rust-check 同层：几十秒出结果，拦在两矩阵打包之前。
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 跑全部契约测试
        run: node tests/run-all.js

      # 铁律「写了守卫 ≠ 有了守卫」：这一条变异源码、断言守卫真的判红。
      # 少了它，上面的 40 个测试里有多少是恒绿的谁也不知道。
      # 先花 1 秒查锚点：删改 UI 后「断言改了、变异锚点没跟着改」是最常见的失效方式
      # （2026-10-26 实例），完整验证要十几分钟，失败原因却常常只是这一行找不到。
      - name: 变异锚点自检（1 秒，先失败先报）
        run: python3 tools/verify-guards.py --anchors

      - name: 守卫有效性验证（故意违反须被判红）
        run: python3 tools/verify-guards.py

      # ---- 常驻扫描器 ----
      # ★ 2026-09-28 新增。这四个脚本此前**没有任何入口调用它们** —— 说明里写着
      #   「用法：改完 ucode 就跑一次」「这一类问题以后自动抓」，但"自动"实际靠人记得，
      #   属于「写了守卫 ≠ 有了守卫」的第三种形态：**守卫存在，却从不运行**。
      #   它们守的还都是"编译能过、部署也看不出来、只有真跑才炸"的那一类，
      #   恰恰最需要每次推送都过一遍。全部只读、几秒结束。
      - name: ucode 函数顺序（不提升函数，调用早于定义只有真跑才炸）
        run: python3 tools/check-ucode-order.py

      - name: 行尾必须 LF（CRLF 会让假设 LF 的正则静默失效）
        run: python3 tools/check-line-endings.py

      # 该脚本需要一个 node 来载入 rpc.js 问 isRetryableRead() 的真实答案；
      # setup-node 已把 node 放进 PATH，脚本自己会找到（不必设 NODE_BIN）。
      - name: AT 读写分类对照手册（query 被当成写命令 → 不缓存、不重试）
        run: python3 tools/audit-at-reads.py

      - name: 孤儿与残留扫描器的自证（14 项，证明检查本身能报红）
        run: python3 tools/find-orphans.py --self-test-only

  # ---- 是否需要真打包 ----
  # ★ 2026-09-28 新增（用户反馈「频繁推送非常浪费时间」）：
  #   打包要跑两个矩阵的 docker 构建（数小时），而只改 tests/ 或文档时完全不需要 ——
  #   最近几十轮大量改动都只落在 tests/ 里，每次都白烧一遍机时。
  #   ★ 设计原则是**保守**：输出 code 默认 true，任何取不到改动清单的情况
  #     （tag 推送、workflow_dispatch、shallow clone、命令失败）一律**照旧打包**。
  #     最坏结果只是"多跑一次本该跳过的"，绝不会"该跑的没跑"。
  #   判定：改动文件里只要有一个**不在** tests/ tools/ 或 *.md 之下，就需要打包。
  needs_code:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      code: ${{ steps.judge.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断本次改动是否需要打包
        id: judge
        run: |
          set -u
          code=true
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.event.after }}'
          if [ -n "$BEFORE" ] && [ -n "$AFTER" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
            fi
          fi
          if [ -z "${CHANGED:-}" ]; then
            echo "==> 取不到改动清单（tag/dispatch/首次推送），按需要打包处理"
          elif echo "$CHANGED" | grep -qvE '^(tests/|tools/|[^/]*\.md$)'; then
            echo "==> 有非 tests/tools/md 改动，需要打包"
          else
            code=false
            echo "==> 本次只动了 tests/ tools/ 或文档，跳过打包"
            echo "$CHANGED" | sed 's/^/    /'
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  build:
    # 闸门：rust-check / contract-check 挂了就不打包、更不发布。没有 needs 的话
    # 两个 job 并行跑，检查结果只能靠人盯着看，等于没拦。
    needs: [rust-check, contract-check, needs_code]
    # ★ 2026-09-28：只在**打标签**或**手动触发**时打包；push 到 main 不打包（见文件头 on: 段）。
    #   注意仍然 needs rust-check / contract-check —— 检查挂了就不打包、更不发布。
    #   needs_code（「本次是否只动了 tests/tools/文档」）保留在 needs 里：它在 tag/手动
    #   之外的场景不再决定要不要打包，但判断结果仍会打进日志，且恢复 push 自动打包时
    #   把上面这行 if 改回去即可，不必再去找这段闸门。
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- 最新主线 → .apk ----
          # 镜像 tag 格式：openwrt/sdk:<架构>-<版本>（已用 Docker Hub API 核实）
          - image: aarch64_cortex-a53-main
            arch: aarch64_cortex-a53
            rust: aarch64-unknown-linux-musl
            ver: main
            target: qualcommax/ipq50xx
            fmt: apk
          # ---- 老版本 23.05 → .ipk ----
          - image: aarch64_cortex-a53-23.05.5
            arch: aarch64_cortex-a53
            rust: aarch64-unknown-linux-musl
            ver: 23.05.5
            target: mediatek/filogic
            fmt: ipk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in OpenWrt SDK container
        run: |
          mkdir -p out
          set +e
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v "$PWD/out:/out" \
            openwrt/sdk:${{ matrix.image }} \
            /work/scripts/sdk-build.sh "${{ matrix.arch }}" "${{ matrix.rust }}" "${{ matrix.ver }}" "${{ matrix.target }}" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "==> docker run 退出码: $rc"
          exit $rc

      # 构建日志对排查至关重要：Actions 日志下载受网络策略限制时，
      # 把日志提交到 ci-logs-<fmt>-<arch> 分支，便于离线取回。
      - name: Publish build log branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          BR="ci-logs-${{ matrix.fmt }}-${{ matrix.arch }}"
          git checkout --orphan "$BR"
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p logs
          cp build.log "logs/build.log" 2>/dev/null || true
          find out -type f | sort > logs/artifacts.txt 2>/dev/null || true
          git add -f logs
          git commit -m "ci log ${{ matrix.fmt }}-${{ matrix.arch }} run ${{ github.run_id }}"
          git push --force origin "HEAD:$BR"

      - name: Verify single package bundle
        run: |
          set -e
          if [ -z "$(find "out/${{ matrix.arch }}" -type f -name 'luci-app-mt5700*' -not -name 'luci-i18n*' -print -quit)" ]; then
            echo "::error::缺少 luci-app-mt5700 主包（arch=${{ matrix.arch }} fmt=${{ matrix.fmt }}）"
            exit 1
          fi
          echo "==> out/${{ matrix.arch }} 产物："
          ls -la "out/${{ matrix.arch }}/"

          # 单包必须自带后端。OpenWrt apk 非标准 tar，workflow 侧做体积闸门：
          # 纯前端约 100-200KB，含 Rust 后端约 1MB+
          PKG=$(find "out/${{ matrix.arch }}" -type f -name 'luci-app-mt5700*' -not -name 'luci-i18n*' -print -quit)
          SZ=$(wc -c < "$PKG")
          echo "==> 主包 $(basename "$PKG") 大小 ${SZ} bytes"
          if [ "$SZ" -lt 500000 ]; then
            echo "::error::主包过小 (${SZ}B)，可能未并入 Rust 后端"
            exit 1
          fi
          echo "==> 体积校验通过（单包策略）"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fmt }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  # ---- 统一发布：每次编译成功后运行一次，汇总全部架构产物并上传 Release ----
  # 不能放在 build job 内：2 个矩阵 job 并发发布同一 tag 的 Release 会 API 竞态，
  # 导致 Release 创建失败或资产互相覆盖。这里由 release job 串行汇总后再发布。
  # 资产统一加 <架构>- 前缀：不同架构的依赖包 basename 相同（如 libc-1.2.6-r5.apk），
  # 同名文件在同一 Release 内必然冲突。用 gh CLI 替代 softprops 避免元数据更新 404 竞态。
  release:
    needs: build
    # 发布时机：打标签（用标签名）或**手动触发**（用 Makefile 的 PKG_VERSION，
    # 同名则覆盖更新）。PR 必须显式挡住 —— 否则每个 PR 都会去创建或覆盖同名 Release；
    # 而 build 在 PR / push 到 main 时本来就被跳过，release 因 needs 未成功也不会跑，
    # 这里是第二道闸。
    # ★ 2026-09-28：push 到 main 不再自动打包（见文件头 on: 段），所以本 job 实际只在
    #   「打 v* 标签」和「手动 workflow_dispatch」两种情况下执行。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (read PKG_VERSION)
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -1 | tr -d '[:space:]')
            [ -n "$VER" ] || VER="0.0.0-dev"
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "==> 发布版本: ${TAG} (ref=${GITHUB_REF})"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: out/
          merge-multiple: true

      - name: Flatten packages with arch prefix
        run: |
          mkdir -p dist
          while IFS= read -r f; do
            arch=$(basename "$(dirname "$f")")
            cp "$f" "dist/${arch}-$(basename "$f")"
          done < <(find out -type f \( -name '*.apk' -o -name '*.ipk' \) | sort)
          echo "==> 待发布文件："
          find dist -type f | sort

      - name: Verify dist completeness
        run: |
          set -e
          # 主包（前端+后端合一）必须覆盖全部 2 个构建组合（aarch64_cortex-a53 × apk/ipk）
          count=$(find dist -type f -name '*-luci-app-mt5700*' -not -name '*luci-i18n*' | wc -l)
          echo "==> luci-app-mt5700 主包: ${count} 个"
          if [ "$count" -lt 2 ]; then
            echo "::error::主包仅有 ${count} 个（期望 2 个：1 架构 × apk/ipk），拒绝发布不完整的 Release"
            find dist -type f | sort
            exit 1
          fi
          # 架构覆盖：单包内含二进制，必须每个架构都有
          # ★ 2026-09-28：矩阵只剩 aarch64_cortex-a53（见文件头「架构矩阵」注释）。
          #   这两个循环是与矩阵**成对**的约束：加回架构时必须同步扩这里，
          #   否则新架构的包压根不会被断言覆盖（缺了也照样发布）。
          for arch in aarch64_cortex-a53; do
            for fmt in apk ipk; do
              f=$(find dist -type f -name "${arch}-luci-app-mt5700*.${fmt}" -not -name '*luci-i18n*' -print -quit)
              [ -n "$f" ] || { echo "::error::缺少 ${arch}-${fmt} 主包"; exit 1; }
              echo "==> 已覆盖 ${arch}/${fmt}: $(basename "$f")"
            done
          done

      - name: Clean up previous release (same tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --repo "${GITHUB_REPOSITORY}"
            echo "==> 已清理旧 Release ${TAG}，将重建"
          fi

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          # 自动生成的变更列表（PR 标题等）保留，前面拼一段固定的「按架构选包」说明 ——
          # 发版后最常见的问题就是下错架构装不上（apk 报 error: uninstallable）。
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > autonotes.md || echo "" > autonotes.md
          cat .github/release-notes-header.md autonotes.md > notes.md
          echo "==> Release notes 已生成（$(wc -c < notes.md) 字节）"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          mapfile -t FILES < <(find dist -type f | sort)
          gh release create "$TAG" "${FILES[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file notes.md \
            --title "AT WebServer ${TAG}"
          echo "==> Release ${TAG} 已发布，资产 ${#FILES[@]} 个"
