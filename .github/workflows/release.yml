name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            curl \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: sdk-${{ runner.os }}

      - name: Build with official OpenWrt SDK
        run: ./scripts/build-release.sh

      - name: Show build output
        run: |
          echo "===== GitHub Context ====="
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo
          echo "===== dist-release ====="
          ls -lah dist-release || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mt5700m-${{ github.ref_name || 'manual' }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: ${TAG}"

          # Extract version for changelog
          VERSION="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"

          # Generate Chinese release body
          BODY=$(cat << 'RELEASEEOF'
          ## MT5700M Manager v${VERSION}

          ### 📋 更新内容

          - **修复邻区锁频/锁小区功能无法使用的问题**
            - 根因：cellLockCard 传给后端的 bands 参数为空字符串 ''，后端验证失败（exit 64）
            - 新增 bandNameToNumber() 函数，将频段名转为数字（n41→41, B3→3）
            - 锁定命令现在正确传递频段号、ARFCN、PCI 等全部参数
            - 支持三种锁定模式：Band Lock / ARFCN Lock / Cell Lock
          - **新增「填入面板」按钮**
            - 每个邻区卡片现在有两个按钮：「填入」和「锁定」
            - 点击「填入」自动将该小区的频段、ARFCN、PCI 填入页面下方的「频段与小区选择」面板
            - 填入后可检查修改，再点击「检查并应用」生效
            - 面板自动滚动到可视区域
          - **SSB 邻区不再显示 RSRQ**（硬件限制，AT^NRSSBID? 不提供邻区 RSRQ）
          - **邻区按 RAT 分组显示**（5G 显示 NR 邻区，4G 显示 LTE 邻区）
          - **频段名显示修正**（ARFCN 504990 正确显示为 n41 而非 n7）
          - **RSRQ/SINR 解析修正**（MONNC 补 PCI 字段、MONSC LTE 无 SCS 字段）

          ### 📦 支持模组
          - 鼎桥 MT5700M-CN（海思巴龙平台，5G NR / LTE-FDD / LTE-TDD / WCDMA）

          ### 📱 适用固件
          - OpenWrt 21.02+ / ImmortalWrt / Lean 的 LuCI 界面
          RELEASEEOF
          )

          BODY="${BODY//\${VERSION}/${VERSION}}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload "${TAG}" dist-release/* --clobber
          else
            echo "Creating new release with Chinese notes..."
            gh release create "${TAG}" \
              dist-release/* \
              --title "MT5700M Manager v${VERSION}" \
              --notes "${BODY}"
          fi
