name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            curl \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: sdk-${{ runner.os }}

      - name: Build with official OpenWrt SDK
        run: ./scripts/build-release.sh

      - name: Show build output
        run: |
          echo "===== GitHub Context ====="
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo
          echo "===== dist-release ====="
          ls -lah dist-release || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mt5700m-${{ github.ref_name || 'manual' }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: ${TAG}"

          # Extract version for changelog
          VERSION="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"

          # Generate Chinese release body
          BODY=$(cat << 'RELEASEEOF'
          ## MT5700M Manager v${VERSION}

          ### 📋 更新内容

          - **修复 SSB 邻区 RSRQ 显示为 --dB 的问题**
            - 根因：AT^NRSSBID? 命令的邻区字段不含 RSRQ（手册 13.28：仅 NB_PCI/NB_ARFCN/NB_RSRP/NB_SINR）
            - SSB 邻区卡片不再显示 RSRQ 信号条（数据不存在），只显示 RSRP + SINR
            - 小区扫描的 MONNC 邻区仍正常显示 RSRQ（该命令提供 RSRQ 数据）
          - **邻区按 RAT 分组显示**
            - 5G（NR）驻网时：主显示 NR 邻区，LTE 邻区单独分组
            - 4G（LTE）驻网时：主显示 LTE 邻区，NR 邻区单独分组
            - 分组标题分别为 "NR 邻区 (N)" / "LTE 邻区 (N)"
          - **首页与上游 FAN789 完全对齐**
            - status.js 已逐行与上游一致，更新后自动生效
          - **修复频段名显示错误（n7 → n41）**
          - **修复 SSB 信息面板一直显示"加载中"的问题**
          - **修复扫描结果中 RSRQ/SINR 键位（MONNC 漏 PCI / MONSC LTE 无 SCS）**

          ### 📦 支持模组
          - 鼎桥 MT5700M-CN（海思巴龙平台，5G NR / LTE-FDD / LTE-TDD / WCDMA）

          ### 📱 适用固件
          - OpenWrt 21.02+ / ImmortalWrt / Lean 的 LuCI 界面
          RELEASEEOF
          )

          BODY="${BODY//\${VERSION}/${VERSION}}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload "${TAG}" dist-release/* --clobber
          else
            echo "Creating new release with Chinese notes..."
            gh release create "${TAG}" \
              dist-release/* \
              --title "MT5700M Manager v${VERSION}" \
              --notes "${BODY}"
          fi
