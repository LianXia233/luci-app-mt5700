name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            curl \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: sdk-${{ runner.os }}

      - name: Build with official OpenWrt SDK
        run: ./scripts/build-release.sh

      - name: Show build output
        run: |
          echo "===== GitHub Context ====="
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo
          echo "===== dist-release ====="
          ls -lah dist-release || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mt5700m-${{ github.ref_name || 'manual' }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload "${TAG}" dist-release/* --clobber
          else
            echo "Creating new release..."
            gh release create "${TAG}" \
              dist-release/* \
              --title "MT5700M Manager ${TAG}" \
              --generate-notes
          fi
