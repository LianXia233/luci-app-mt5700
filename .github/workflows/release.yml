name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            curl \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: sdk-${{ runner.os }}

      - name: Build with official OpenWrt SDK
        run: ./scripts/build-release.sh

      - name: Show build output
        run: |
          echo "===== GitHub Context ====="
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo
          echo "===== dist-release ====="
          ls -lah dist-release || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mt5700m-${{ github.ref_name || 'manual' }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: ${TAG}"

          # Extract version for changelog
          VERSION="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"

          # Generate Chinese release body
          BODY=$(cat << 'RELEASEEOF'
          ## MT5700M Manager v${VERSION}

          ### 📋 更新内容

          - **修复扫描结果中 RSRQ / SINR 显示异常**
            - `^MONNC` 邻区解析漏掉 PCI 字段，导致 RSRP/RSRQ/SINR 全部错位一格
            - `^MONSC` 服务小区此前统一按 NR 布局解析，LTE 实际没有 SCS 字段，字段全部错位
            - 现严格按 AT 手册 13.9/13.10 分 RAT 解析：NR 与 LTE 各用正确布局
            - LTE 小区第三项按手册显示 RSSI/RXLEV（LTE 的 ^MONSC/^MONNC 不上报 SINR）
            - 过滤手册定义的无效哨兵值（RSRP -1256 / RSRQ -348 / SINR -188），显示 "--" 而非荒谬数值
          - **修复频段名显示错误（n7 → n41）**
            - 按 MT5700M-CN 硬件设计指南 Table 5-1 重写 ARFCN→频段映射
            - 移除模组不支持的频段（n7/n77/n38），2524.95 MHz 正确显示为 n41
          - **修复 SSB 信息面板一直显示"加载中"的问题**
          - **邻区卡片显示 PCI，一键锁定使用正确的 PCI 值**

          ### 📦 支持模组
          - 鼎桥 MT5700M-CN（海思巴龙平台，5G NR / LTE-FDD / LTE-TDD / WCDMA）

          ### 📱 适用固件
          - OpenWrt 21.02+ / ImmortalWrt / Lean 的 LuCI 界面
          RELEASEEOF
          )

          BODY="${BODY//\${VERSION}/${VERSION}}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload "${TAG}" dist-release/* --clobber
          else
            echo "Creating new release with Chinese notes..."
            gh release create "${TAG}" \
              dist-release/* \
              --title "MT5700M Manager v${VERSION}" \
              --notes "${BODY}"
          fi
