name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            curl \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: sdk-${{ runner.os }}

      - name: Build with official OpenWrt SDK
        run: ./scripts/build-release.sh

      - name: Show build output
        run: |
          echo "===== GitHub Context ====="
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo
          echo "===== dist-release ====="
          ls -lah dist-release || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mt5700m-${{ github.ref_name || 'manual' }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: ${TAG}"

          # Extract version for changelog
          VERSION="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"

          # Generate Chinese release body
          BODY=$(cat << 'RELEASEEOF'
          ## MT5700M Manager v${VERSION}

          ### 📋 更新内容

          - **v2.3.26 修复：构建脚本三处问题（基于源码分析）**
            - **问题一（重拷贝时机错误）**：原 `scripts/build-release.sh` 在 `make compile` **之后**才 `cp -a` 覆盖 `/www/5700/`，但 OpenWrt 中 `make package/X/compile` 含 install+打包步骤，返回时 `.apk` 已定型，覆盖对已打好的包**无效**（死代码、给人错觉）。修正：删除该无效块——干净产物由根因修复（`.gitattributes` 强制 `eol=lf`，SDK 不再因 CRLF 损坏大文件）+ v2.3.25 的 `node --check` 全量护栏（任何损坏块直接 `exit 1`）共同保证。
            - **问题二（node --check 硬编码文件名）**：已在 v2.3.25 修复——由硬编码 `umi.ec9b4b52.js` 改为 `find .../www/5700 -name '*.js'` 遍历全部 JS 校验，content hash 变更后不再静默失效。
            - **问题三（缺静态 config.json）**：新增 `htdocs/5700/config.json` 静态兜底（`{"at":{"host":"192.168.1.1","port":8765},"status":"true","require_auth":false}`），init 脚本 `at-webserver` 运行时用 LAN IP 覆盖此文件；init 未运行时 SPA 仍能拿到兜底配置，避免无配置白屏。
          - **v2.3.25 修复：构建护栏加固 — 杜绝单个路由块被截断导致该路由白屏**
            - **根因**：`scripts/build-release.sh` 的 `node --check` 语法护栏此前只校验主包 `umi.ec9b4b52.js`，漏掉了各路由的 `.async.js` 异步块。若某个路由块（如 `p__CPE__Network__Info__index.*.async.js`）被 OpenWrt SDK 构建过程截断，整包会通过校验、装到设备后**仅该路由白屏**（其余页面正常），正是 `/network/info` 白屏的典型症状
            - **修复**：护栏改为 `find .../www/5700 -name '*.js'` 遍历**全部** JS 做 `node --check`，任一文件语法错误直接 `exit 1`，从构建期拦截任何被截断的路由块
            - 注：v2.3.22 起已用 `cp -a` 从源码完整覆盖 `/www/5700/`，正常构建产物块均干净；此护栏为防御性兜底，确保未来任何 SDK 行为变化都不会再静默放出损坏路由块
          - **v2.3.24 优化：WebUI 按钮移入 hero 卡片内 + 整体排版优化**
            - **「打开模块 WebUI」按钮位置调整**：从 hero 外部独立行移入 hero 右侧区域（`mt5700m-hero-side`），位于「已连接」状态和「立即刷新」按钮之间，三者水平排列
            - **按钮样式重新设计**：从渐变大卡片改为半透明胶囊样式（`rgba(255,255,255,.18)` + 细边框），与 hero 背景融合，更紧凑（仅显示 🌐 + "WebUI" + ↗，隐藏副标题）
            - **hero-side 布局优化**：从纵向堆叠（`flex-direction:column`）改为横向排列（`flex-direction:row`），三个控件（状态/WebUI/刷新）一行展示，空间利用更合理
            - **移动端适配**：小屏幕下 `hero-side` 自动换行（`flex-wrap:wrap`），保持可用性
          - **v2.3.23 优化：首页 UI 布局与运营商显示**
            - **「打开模块 WebUI」按钮缩小**：从全宽大卡片改为紧凑行内按钮（padding 7px→14px, icon 38px→26px），不再占据整行空间
            - **运营商名称和图标排版优化**：hero 区域运营商名放大（11px→14px bold）、图标增大（16px→20px）并独立样式类 `.mt5700m-hero-op`，视觉层次更清晰
            - **四大运营商 SVG logo 美化**：中国移动/联通/电信/广电的 inline SVG 图标优化（圆角 8→9、更精准的品牌色、广电字体改用系统中文字体栈）
          - **v2.3.22 修复：WebUI 白屏 + 后端无法自启**
            - **CI 构建脚本导致 APK 内 `umi.ec9b4b52.js` 被截断（白屏）**：`scripts/build-release.sh` 的 `rm -rf` 清理遗漏 `staging_dir/target-*/root-*/www/5700`，SDK 复用上游残留的损坏文件被打包；新增清理该目录，并在 sanity check 阶段用 `node --check` 对 `umi.ec9b4b52.js` 做语法校验作为兜底护栏
            - 修复 `at-webserver` init 在 `USE_PROCD=1` 下同步调用 `/etc/init.d/firewall reload` 造成的 procd 死锁，导致后端进程永不启动、WebUI 全部功能失效
            - 修复 SPA 兜底配置 `/www/5700/config.json` 的 `host` 误带 CIDR 掩码（如 `192.168.10.1/24`）导致 WebSocket 地址非法的缺陷
            - 安装后自动 `enable`+`start`，重启路由器后端自动拉起，WebUI 正常加载并使用
          - **WebUI 回退到 v2.3.18 原版（UMI.js / React SPA）**
            - 移除 1:1 复刻的手写 SPA（index.html + app.js + bg1.jpg），恢复官方 UMI 构建产物
            - 多路由：概览 / 网络 / 短信 / 系统 / AT 终端，加载动画与响应式布局完整
            - 首页集成「WebUI 入口」按钮（mt5700m-webui-cta），一键跳转 /5700/
          - **后端 AT 服务（at-server.py，UBUS + WebSocket 双模式）**
            - 纯标准库 + `websockets` + `pyserial`，**无 aiohttp 依赖**，轻量稳定
            - UBUS 模式直连本地模块串口；网络 AT 模式可连远程 WS（方便外部 WebUI 接入）
            - 端口 8765，自动重连，支持并发 AT 命令队列
          - **依赖内置（打包即包含，GitHub 自动编译产出）**
            - `luci-app-mt5700m` 主包：`LUCI_DEPENDS` 声明 `python3` + `python3-websockets` + `python3-pyserial` + `ubus-at-daemon` + `sms-tool_q`
            - `ubus-at-daemon`、`sms-tool_q` 由 QModem feed 在 CI 内编译并随包发布
            - 内核模块：`kmod-usb2/3`、`kmod-usb-serial(-option)`、`kmod-usb-net(-cdc-ether/-cdc-ncm)` 已在 `LUCI_EXTRA_DEPENDS` 声明
          - **信号与射频展示**
            - RSRP / RSRQ / SINR / 温度图形化量表，按质量自动变色
            - 载波聚合（CA）完整展示：主载波 + 各辅载波的频段 / ARFCN / 带宽
            - 邻区扫描按 RAT 分组（NR / LTE），支持一键填入面板 + 锁定
            - SSB 波束信号图形化，锁频支持 Band / ARFCN / Cell 三种模式
          - **运营商中文名 + Logo**
            - 中国移动 / 联通 / 电信 / 广电，内联 SVG Logo
          - **SIM 增强**：APN、QCI、签约速率显示

          ### 📦 发布产物（dist-release）
          - `luci-app-mt5700m-*.apk`（主包，含 /www/5700/ WebUI）
          - `ubus-at-daemon-*.apk`、`sms-tool_q-*.apk`（随包编译）
          - `SHA256SUMS`、`openwrt-sdk-build.pem`

          ### 📦 支持模组
          - 鼎桥 MT5700M-CN（海思巴龙平台，5G NR / LTE-FDD / LTE-TDD / WCDMA）

          ### 📱 适用固件
          - OpenWrt 21.02+ / ImmortalWrt / Lean 的 LuCI 界面（mediatek/filogic）
          RELEASEEOF
          )

          BODY="${BODY//\${VERSION}/${VERSION}}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload "${TAG}" dist-release/* --clobber
          else
            echo "Creating new release with Chinese notes..."
            gh release create "${TAG}" \
              dist-release/* \
              --title "MT5700M Manager v${VERSION}" \
              --notes "${BODY}"
          fi
