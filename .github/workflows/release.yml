name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            curl \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: sdk-${{ runner.os }}

      - name: Build with official OpenWrt SDK
        run: ./scripts/build-release.sh

      - name: Show build output
        run: |
          echo "===== GitHub Context ====="
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo
          echo "===== dist-release ====="
          ls -lah dist-release || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mt5700m-${{ github.ref_name || 'manual' }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: ${TAG}"

          # Extract version for changelog
          VERSION="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"

          # Generate Chinese release body
          BODY=$(cat << 'RELEASEEOF'
          ## MT5700M Manager v${VERSION}

          ### 📋 更新内容

          - **RSRQ / SINR / 温度图形化显示**
            - 首页信号卡：RSRQ、SINR、温度改为彩色迷你量表（gauge），按质量自动变色（优秀/良好/一般/较弱），并标注刻度区间
            - 射频页 Hero：RSRP / RSRQ / SINR 由纯文本改为彩色量表条，并新增温度量表（共 4 项）
            - 后端 network 命令新增温度输出（AT^CHIPTEMP?），射频页首屏无需额外往返即可显示温度
          - **修复邻区锁频/锁小区功能无法使用的问题**
            - 根因：cellLockCard 传给后端的 bands 参数为空字符串 ''，后端验证失败（exit 64）
            - 新增 bandNameToNumber() 函数，将频段名转为数字（n41→41, B3→3）
            - 锁定命令现在正确传递频段号、ARFCN、PCI 等全部参数
            - 支持三种锁定模式：Band Lock / ARFCN Lock / Cell Lock
          - **新增「填入面板」按钮**
            - 每个邻区卡片现在有两个按钮：「填入」和「锁定」
            - 点击「填入」自动将该小区的频段、ARFCN、PCI 填入页面下方的「频段与小区选择」面板
            - 填入后可检查修改，再点击「检查并应用」生效
            - 面板自动滚动到可视区域
          - **SSB 邻区不再显示 RSRQ**（硬件限制，AT^NRSSBID? 不提供邻区 RSRQ）
          - **邻区按 RAT 分组显示**（5G 显示 NR 邻区，4G 显示 LTE 邻区）
          - **频段名显示修正**（ARFCN 504990 正确显示为 n41 而非 n7）
          - **RSRQ/SINR 解析修正**（MONNC 补 PCI 字段、MONSC LTE 无 SCS 字段）
          - **多载波服务小区完整显示**
            - 载波聚合（CA）激活时，首页「载波状态」卡片展开列出所有分量载波
            - 主载波（PCell）与每个辅载波（SCell 1/2…）分别标注
            - 每张载波卡显示：制式 · 频段、ARFCN、下行频率/带宽、上行频率/带宽
            - 单载波时仍只显示频段标签，保持简洁
          - **LTE 邻区也在主页显示**
            - 射频诊断区新增「LTE neighbour cells」面板，与主页面 NR 邻区一样支持一键「填入 / 锁定」
            - 后端 radio-diagnostics 增加 AT^MONNC 邻区查询
          - **锁频面板实时读取当前锁定信息**
            - 修复根因：原 matchValues 只取首行（仅锁定类型），丢弃了已锁 band/ARFCN/PCI
            - 新增 collectFreqLock() 收集 AT^LTEFREQLOCK? / AT^NRFREQLOCK? 的全部行
            - 打开「频段与小区选择」时，面板自动填入选中的锁频类型与已锁频段、ARFCN、PCI
          - **锁频时自动填入相应选项并应用**
            - 邻区卡片「锁定」按钮在确认前会先把该小区的频段、ARFCN、PCI 自动填入锁频面板
            - 「填入」按钮逻辑复用，面板即时反映所选小区
          - **首页新增「模块与 SIM」信息卡**
            - 新增模块卡：厂商、型号、固件版本、IMEI、AT 端口
            - 新增 SIM 卡：运营商、接入技术、ICCID、IMSI、号码
            - 后端 status 增加 AT^ICCID? / AT+CIMI 查询，首页无需额外往返即可显示
          - **运营商中文名 + Logo 显示**
            - 首页（status.js）和射频页（network.js）统一使用中文运营商名
            - 支持四大运营商：中国移动 / 中国联通 / 中国电信 / 中国广电
            - 每个运营商配有内联 SVG Logo（首页标题栏、射频页 Hero 区域）
          - **SIM 卡增强信息**
            - 新增当前 APN 显示（从 AT+CGDCONT? CID 1 解析）
            - 新增 QCI（QoS 类标识符）显示（从 AT+CGEQOSRDP=1 解析）
            - 新增签约速率显示（下行/上行 Mbps，从 AT^DSAMBR=1 解析）
            - SIM 卡标题改为「SIM & Subscription」，更准确反映内容
          - **修复 [object HTMLElement] 渲染 Bug**
            - 根因：row() / infoRow() 函数将 mcsDetailNode() 返回的 DOM 元素
              强制包裹在 E('strong') 中，LuCI E() 某些路径下会 toString()
            - 修复：row() 和 infoRow() 增加 HTMLElement 类型检测，
              DOM 子节点直接插入而非文本化
            - 影响：射频诊断区 SSB/MCS 信息、信号条等不再显示 [object HTMLElement]

          ### 📦 支持模组
          - 鼎桥 MT5700M-CN（海思巴龙平台，5G NR / LTE-FDD / LTE-TDD / WCDMA）

          ### 📱 适用固件
          - OpenWrt 21.02+ / ImmortalWrt / Lean 的 LuCI 界面
          RELEASEEOF
          )

          BODY="${BODY//\${VERSION}/${VERSION}}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload "${TAG}" dist-release/* --clobber
          else
            echo "Creating new release with Chinese notes..."
            gh release create "${TAG}" \
              dist-release/* \
              --title "MT5700M Manager v${VERSION}" \
              --notes "${BODY}"
          fi
