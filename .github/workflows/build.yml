name: Build & Release

# Build the LuCI package for multiple OpenWrt targets and publish both
# opkg (.ipk) and apk (.apk) artifacts to GitHub Releases.
#
# Triggers / publish semantics:
#   - push of a tag  "v*"        -> build + publish STABLE release (tag = pushed tag, marked Latest)
#   - workflow_dispatch          -> build + publish release:
#                                    * release_tag given  -> STABLE release (tag = release_tag, Latest)
#                                    * release_tag empty  -> ROLLING "latest" PRERELEASE (updated in place, not Latest)
#   - pull_request              -> build only (no release), as a CI gate
#
# Upload path: each `openwrt` job uploads `bin/packages` (+ logs) as a
#   `packages-<arch>-<sdk>` artifact -> the `release` job downloads & merges them
#   into `dist/packages/` -> uploaded to the Release.
# Artifact naming (set by the OpenWrt SDK):
#   luci-app-mt5700m_<pkgver>_<target>.ipk   (24.10.x, opkg)
#   luci-app-mt5700m_<pkgver>_<target>.apk   (25.x, apk)
#   plus a top-level SHA256SUMS.txt.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.0.0). Leave empty to build only."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed by softprops/action-gh-release

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — cross-compile the Rust backend (single `mt5700m` binary) for every
  # musl target we ship.  Uses the bundled rust-lld (self-contained) so no
  # external cross linker is required.  Binaries are uploaded as artifacts.
  # ---------------------------------------------------------------------------
  rust:
    name: rust ${{ matrix.rust_target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: only amd64 + arm64. The musl `rust-std` for mips/mipsel/i686 was
        # removed from the Rust *stable* channel, so those targets can no longer
        # be cross-built with the bundled rust-lld here. Local builds can still
        # target them via the Makefile's RUST_TARGET mapping if a suitable
        # toolchain is provided.
        rust_target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build (self-contained rust-lld, no external linker)
        working-directory: luci-app-mt5700m/mt5700m-rs
        run: |
          cargo build --release --target ${{ matrix.rust_target }} \
            --config 'target.${{ matrix.rust_target }}.linker="rust-lld"'

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mt5700m-${{ matrix.rust_target }}
          path: luci-app-mt5700m/mt5700m-rs/target/${{ matrix.rust_target }}/release/mt5700m
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Stage 2 — package the binary with the official OpenWrt SDK.  The SDK
  # container has no Rust toolchain, so we drop the prebuilt binary next to the
  # package Makefile (the Makefile's Build/Compile copies it when present).
  # Matrix = (arch x SDK version).  24.10.x ships opkg (.ipk); 25.x ships apk.
  # ---------------------------------------------------------------------------
  openwrt:
    name: ${{ matrix.arch }} / ${{ matrix.sdk }} (${{ matrix.format }})
    needs: rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # amd64 (x86_64) + arm64 (aarch64_generic) only — see note in the rust job.
        # 24.10.x ships opkg (.ipk); 25.x ships apk. SDK tags verified against
        # ghcr.io/openwrt/sdk (e.g. x86_64-24.10.8, aarch64_generic-25.12.5).
        include:
          - { arch: x86_64,          rust_target: x86_64-unknown-linux-musl,    sdk: "24.10.8", format: ipk }
          - { arch: aarch64_generic, rust_target: aarch64-unknown-linux-musl,   sdk: "24.10.8", format: ipk }
          - { arch: mediatek-filogic, rust_target: aarch64-unknown-linux-musl, sdk: "24.10.8", format: ipk }
          - { arch: x86_64,          rust_target: x86_64-unknown-linux-musl,    sdk: "25.12.5", format: apk }
          - { arch: aarch64_generic, rust_target: aarch64-unknown-linux-musl,   sdk: "25.12.5", format: apk }
          - { arch: mediatek-filogic, rust_target: aarch64-unknown-linux-musl, sdk: "25.12.5", format: apk }
    steps:
      - uses: actions/checkout@v4

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          pattern: mt5700m-*
          path: /tmp/rustbins
          merge-multiple: false

      - name: Stage prebuilt binary for this target
        run: |
          set -e
          d="/tmp/rustbins/mt5700m-${{ matrix.rust_target }}"
          dst="luci-app-mt5700m/prebuilt/${{ matrix.rust_target }}"
          mkdir -p "$dst"
          cp "$d/mt5700m" "$dst/mt5700m"
          chmod +x "$dst/mt5700m"
          ls -l "$dst"

      - name: Build OpenWrt package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          PACKAGES: luci-app-mt5700m
          INDEX: "1"
          BUILD_LOG: "1"
          # QModem feed supplies ubus-at-daemon + sms-tool_q, which
          # luci-app-mt5700m declares as runtime dependencies. Without it the
          # SDK fails to resolve those deps at `feeds install` time.
          # Format: fields joined by '|' -> ' ' in the container's feeds.conf.
          EXTRA_FEEDS: "src-git|qmodem|https://github.com/FUjr/QModem.git;main"

      - name: Upload ${{ matrix.format }} packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}-${{ matrix.sdk }}
          path: |
            bin/packages
            logs
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Stage 3 — collect every .ipk / .apk, compute checksums, publish a Release.
  #
  # Trigger / publish semantics (mirrors the notes in the file header):
  #   - push of a "v*" tag               -> STABLE release, tag = pushed tag (Latest)
  #   - workflow_dispatch + release_tag  -> STABLE release, tag = release_tag (Latest)
  #   - workflow_dispatch (no release_tag) -> ROLLING prerelease, tag = "latest"
  #                                          (updated in place each run; NOT Latest)
  #   - pull_request                     -> skipped (build-only CI gate)
  # Upload path: openwrt jobs upload `bin/packages` as `packages-*` artifacts ->
  #   this job merges them into `dist/packages/` and uploads to the Release.
  # Artifact naming: luci-app-mt5700m_<pkgver>_<target>.{ipk,apk} + SHA256SUMS.txt.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: openwrt
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: /tmp/release
          merge-multiple: true

      - name: Stage dist + checksums
        run: |
          set -e
          rm -rf dist && mkdir -p dist
          cp -r /tmp/release/bin/packages dist/packages
          ( cd dist/packages && find . -type f \( -name '*.ipk' -o -name '*.apk' \) -print0 ) \
            | xargs -0 -I{} sha256sum {} > dist/SHA256SUMS.txt
          echo "Artifacts:" && find dist -type f | sort
          echo "--- SHA256SUMS ---" && cat dist/SHA256SUMS.txt

      - name: Resolve release tag
        id: tag
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.release_tag }}" ]; then
              # Explicit version requested via the workflow_dispatch input.
              TAG="${{ inputs.release_tag }}"
              MAKE_LATEST=true
              PRERELEASE=false
            else
              # No version given: publish to a rolling "latest" prerelease that
              # is updated in place on every manual run (never steals "Latest").
              TAG="latest"
              MAKE_LATEST=false
              PRERELEASE=true
            fi
          else
            # "v*" tag push: stable release named after the tag.
            TAG="${GITHUB_REF_NAME}"
            MAKE_LATEST=true
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/packages/**/*.ipk
            dist/packages/**/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
