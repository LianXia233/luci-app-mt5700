name: Build & Release

# 为多个 OpenWrt 目标构建 LuCI 软件包，并将 opkg (.ipk) 与 apk (.apk) 产物发布到 GitHub Releases。
#
# 触发与发布逻辑：
#   - 推送 "v*" 标签        → 构建 + 发布正式版（STABLE，标记为 Latest）
#   - workflow_dispatch      → 构建 + 发布：
#                               * 填写了 release_tag → 正式版（tag = release_tag，标记为 Latest）
#                               * 未填写 release_tag → 滚动更新的 "latest" 预发布版（就地更新，不标记为 Latest）
#   - pull_request           → 仅构建（不发布），作为 CI 门禁
#
# 上传路径：每个 openwrt 作业上传 bin/packages（+ logs）为 packages-<arch>-<sdk> 产物
#           → release 作业下载并合并到 dist/packages/ → 扁平化后上传到 Release
# 产物命名（由 OpenWrt SDK 决定）：
#   luci-app-mt5700m_<pkgver>_<target>.ipk   (24.10.x, opkg)
#   luci-app-mt5700m_<pkgver>_<target>.apk   (25.x, apk)
#   以及顶层 SHA256SUMS.txt
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的版本标签（例如 v1.0.0）。留空则发布滚动更新的 'latest' 预发布版"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # softprops/action-gh-release 需要

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 阶段 1 — 为所有目标交叉编译 Rust 后端（单个 mt5700m 二进制）
  # 使用自带的 rust-lld，无需外部交叉链接器。二进制作为产物上传。
  # ---------------------------------------------------------------------------
  rust:
    name: rust ${{ matrix.rust_target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 仅支持 amd64 + arm64。musl 的 mips/mipsel/i686 rust-std 已从 stable 通道移除，
        # 因此这里无法再用自带 rust-lld 交叉编译这些目标。本地仍可通过 Makefile 的
        # RUST_TARGET 映射在提供合适工具链时构建。
        rust_target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build (self-contained rust-lld, no external linker)
        working-directory: luci-app-mt5700m/mt5700m-rs
        run: |
          cargo build --release --target ${{ matrix.rust_target }} \
            --config 'target.${{ matrix.rust_target }}.linker="rust-lld"'

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mt5700m-${{ matrix.rust_target }}
          path: luci-app-mt5700m/mt5700m-rs/target/${{ matrix.rust_target }}/release/mt5700m
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 阶段 2 — 使用官方 OpenWrt SDK 打包二进制。
  # SDK 容器没有 Rust 工具链，因此我们把预编译好的二进制放到包 Makefile 旁边
  # （Makefile 的 Build/Compile 会在存在时直接复制）。
  # 矩阵 = (架构 × SDK 版本)。24.10.x 产出 opkg (.ipk)；25.x 产出 apk。
  # ---------------------------------------------------------------------------
  openwrt:
    name: ${{ matrix.arch }} / ${{ matrix.sdk }} (${{ matrix.format }})
    needs: rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 仅 amd64 (x86_64) + arm64 (aarch64_generic) —— 详见 rust 作业说明。
        # 24.10.x 产出 opkg (.ipk)；25.x 产出 apk。
        # SDK 标签已对照 ghcr.io/openwrt/sdk 验证（例如 x86_64-24.10.8、aarch64_generic-25.12.5）。
        include:
          - { arch: x86_64,          rust_target: x86_64-unknown-linux-musl,    sdk: "24.10.8", format: ipk }
          - { arch: aarch64_generic, rust_target: aarch64-unknown-linux-musl,   sdk: "24.10.8", format: ipk }
          - { arch: mediatek-filogic, rust_target: aarch64-unknown-linux-musl, sdk: "24.10.8", format: ipk }
          - { arch: x86_64,          rust_target: x86_64-unknown-linux-musl,    sdk: "25.12.5", format: apk }
          - { arch: aarch64_generic, rust_target: aarch64-unknown-linux-musl,   sdk: "25.12.5", format: apk }
          - { arch: mediatek-filogic, rust_target: aarch64-unknown-linux-musl, sdk: "25.12.5", format: apk }
    steps:
      - uses: actions/checkout@v4

      - name: Download Rust binaries
        uses: actions/download-artifact@v4
        with:
          pattern: mt5700m-*
          path: /tmp/rustbins
          merge-multiple: false

      - name: Stage prebuilt binary for this target
        run: |
          set -e
          d="/tmp/rustbins/mt5700m-${{ matrix.rust_target }}"
          dst="luci-app-mt5700m/prebuilt/${{ matrix.rust_target }}"
          mkdir -p "$dst"
          cp "$d/mt5700m" "$dst/mt5700m"
          chmod +x "$dst/mt5700m"
          ls -l "$dst"

      - name: Build OpenWrt package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          PACKAGES: luci-app-mt5700m
          INDEX: "1"
          BUILD_LOG: "1"
          # QModem feed 提供 ubus-at-daemon + sms-tool_q，
          # luci-app-mt5700m 声明为运行时依赖。没有它会在 feeds install 时解析失败。
          # 格式：字段用 '|' 连接 → 容器内 feeds.conf 用空格。
          EXTRA_FEEDS: "src-git|qmodem|https://github.com/FUjr/QModem.git;main"

      - name: Upload ${{ matrix.format }} packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}-${{ matrix.sdk }}
          # 只上传 packages，不再上传 logs（减少干扰）
          path: bin/packages
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 阶段 3 — 收集所有 .ipk / .apk，计算校验和，发布 Release。
  #
  # 触发 / 发布逻辑（与文件头部注释一致）：
  #   - 推送 "v*" 标签               → 正式版，tag = 推送的标签（Latest）
  #   - workflow_dispatch + release_tag  → 正式版，tag = release_tag（Latest）
  #   - workflow_dispatch（无 release_tag） → 滚动预发布版，tag = "latest"
  #                                          （每次手动运行就地更新；不标记为 Latest）
  #   - pull_request                     → 跳过（仅构建的 CI 门禁）
  # 上传路径：openwrt 作业上传 bin/packages 为 packages-* 产物 →
  #   本作业合并到 dist/packages/ 后扁平化，再上传到 Release。
  # 产物命名：luci-app-mt5700m_<pkgver>_<target>.{ipk,apk} + SHA256SUMS.txt。
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: openwrt
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: /tmp/release
          merge-multiple: true

      - name: Stage dist + checksums
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/packages

          # 复制所有 bin/packages 目录（不同架构会落到不同子目录）
          if [ -d /tmp/release/bin/packages ]; then
            cp -a /tmp/release/bin/packages/. dist/packages/
          else
            # 兼容更扁平的产物布局
            find /tmp/release -type d -name packages -exec cp -a {}/. dist/packages/ \; || true
          fi

          # 把真正的 .ipk / .apk 扁平化到 dist/upload，方便可靠上传
          mkdir -p dist/upload
          find dist/packages -type f \( -name '*.ipk' -o -name '*.apk' \) -print0 \
            | xargs -0 -I{} cp -a {} dist/upload/

          # 正确生成校验和（路径相对 dist/）
          (cd dist && find upload -type f \( -name '*.ipk' -o -name '*.apk' \) -print0 \
            | xargs -0 sha256sum) > dist/SHA256SUMS.txt

          echo "=== 即将发布的文件 ==="
          find dist/upload -type f | sort
          echo "=== SHA256SUMS ==="
          cat dist/SHA256SUMS.txt

          # 提前检查：如果一个包都没有就直接失败
          count=$(find dist/upload -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::没有找到任何 .ipk/.apk 包，终止发布"
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.release_tag }}" ]; then
              # 手动触发并指定了版本号 → 正式版
              TAG="${{ inputs.release_tag }}"
              MAKE_LATEST=true
              PRERELEASE=false
            else
              # 未指定版本号 → 滚动更新的 "latest" 预发布版（不抢 Latest）
              TAG="latest"
              MAKE_LATEST=false
              PRERELEASE=true
            fi
          else
            # 推送了 v* 标签 → 正式版
            TAG="${GITHUB_REF_NAME}"
            MAKE_LATEST=true
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "解析结果 → tag=$TAG  make_latest=$MAKE_LATEST  prerelease=$PRERELEASE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/upload/*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.make_latest }}
          fail_on_unmatched_files: true   # 匹配不到文件就直接失败，避免空发布
          overwrite_files: true           # 对滚动 latest 预发布版安全
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
