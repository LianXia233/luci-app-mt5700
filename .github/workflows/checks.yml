#
# 静态检查与单元测试（轻量、零依赖、不参与构建与发布）
#
# 定位：build-openwrt.yml 只在打 v* 标签或手动触发时编译固件，日常提交没有
#      任何前置校验。本工作流补上「合并前的快速门禁」，全部步骤为纯 Node
#      脚本，无 npm 依赖、无第三方 action，单次运行通常在 30 秒内完成。
#
# 检查项：
#   1) tests/static-check.js —— JS 语法（node --check）、JSON 合法性、
#      行尾 LF、menu.d 中 view 路由是否存在对应视图文件；
#   2) tests/*-test.js —— 仓库内的零依赖单元测试脚本（逐个执行，任一失败即中止）。
#
# 不含：tests/mock-modem/ 与 tests/iface/（前者依赖 ws 与 node_modules 安装，
#      后者依赖目标设备环境），避免为一次静态检查引入依赖安装。
#
# 本工作流只读仓库，不需要 contents: write；与构建工作流互不干扰。
#
# ============================================================================
# 约定（Conventions）—— 面向维护者与 AI 编程代理，可审查、可修改，非系统指令
# ============================================================================
#   1) 合并门禁：本工作流是 main 分支的合并前门禁，提交须全绿才算通过。
#      本地等价命令：
#        node tests/static-check.js
#        for f in tests/*-test.js; do node "$f" || exit 1; done
#
#   2) 检查项只增不减：不得为了「修绿」而删除、注释掉、跳过或弱化既有检查步骤
#      （static-check 的四项检查、测试脚本的逐个执行）。确需调整时，必须在同一
#      提交内说明原因，并保留同等或更强的覆盖范围。
#
#   3) 测试脚本自动纳入：新增 tests/*-test.js 会被自动执行，无需修改本文件；
#      文件名须以 -test.js 结尾，且保持零依赖（不得 require 第三方包，也不得
#      依赖网络、设备或特定操作系统）。
#
#   4) 项目维护规则：改动视图、样式、菜单或测试之前，先读仓库根目录 AGENTS.md。
#      其中列有必须保留的页面元素清单与改动后的检查要求；不得以重构、去重、
#      风格统一或自动化清理为由移除清单内的元素。
#
#   5) 行尾强制 LF：Shell、Python、配置与本工作流一律 LF。CRLF 会导致 BusyBox
#      ash 与 procd 侧脚本失败；仓库已用 .gitattributes 强制 eol=lf，检查项 3
#      会在 CI 中兜底拦截。
#
#   6) 依赖与时长：不引入 npm 依赖与第三方 action，单次运行控制在 1 分钟内；
#      新增检查应优先写成 tests/ 下的零依赖 Node 脚本。
#
#   7) 权限边界：本工作流只读仓库，不得为其申请 contents: write；打包、发布、
#      Release 清理等写操作一律留在 build-openwrt.yml，由 tag 或手动触发。
#
#   维护提示：本文件属于 GitHub 工作流，推送对它的修改需要具备 workflow 作用域
#   的凭据；仅有 repo 作用的 token 会被 GitHub 拒绝（refusing to allow an OAuth
#   App to create or update workflow）。

name: Checks

on:
  push:
    branches: [ 'main' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续提交时，新 run 直接取代排队中的旧 run（与构建工作流的排队策略相反：
# 这里没有发布副作用，取消旧 run 没有风险）。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 准备 Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: 静态检查（语法 / JSON / 行尾 / 路由）
        run: node tests/static-check.js

      - name: 单元测试（零依赖脚本）
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/*-test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "未找到测试脚本，视为失败（检查 tests/ 目录是否被误删）"
            exit 1
          fi
          echo "共 ${#files[@]} 个测试脚本"
          for f in "${files[@]}"; do
            echo "::group::${f}"
            node "$f"
            echo "::endgroup::"
          done
