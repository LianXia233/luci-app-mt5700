#
# 静态检查、单元测试与第三方许可证审计（不参与固件构建与发布）
#
# 定位：build-openwrt.yml 只在打 v* 标签或手动触发时编译固件。本工作流提供
#      日常合并前门禁：Node 静态检查、Rust 单测与第三方依赖许可证审计。
#      不引入 npm 依赖或第三方 GitHub Action；许可证工具使用固定版本的 Cargo CLI。
#
# 检查项：
#   1) tests/static-check.js —— JS 语法（node --check）、JSON 合法性、
#      行尾 LF、menu.d 中 view 路由是否存在对应视图文件；
#   2) tests/*-test.js —— 仓库内的零依赖单元测试脚本（逐个执行，任一失败即中止）。
#      其中 tests/author-attribution-test.js 负责校验作者信息：署名文案
#      「© 2026 LianXia233 · 开发与维护」与 SPDX 标识「GPL-3.0-only」
#      （以脚本内 AUTHOR_TEXT / AUTHOR_LICENSE 常量为准）、链接指向主仓库、
#      target/rel 安全属性、字号与居中、窄屏换行、未扩散到其他视图、历史文案
#      不得回退、AGENTS.md 规则与文案一致。
#   3) src/rust —— `cargo test --locked`（Rust 后端单测，独立 job 计时）；
#      确保 Rust 后端改动也能在合并前通过编译与单元测试。
#   4) Rust 依赖 —— cargo-deny 检查许可证、来源、通配符与重复版本策略；
#      cargo-about 生成逐项许可证文本并写入 GitHub Actions Summary。
#
# 不含：tests/mock-modem/ 与 tests/iface/（前者依赖 ws 与 node_modules 安装，
#      后者依赖目标设备环境），避免为一次静态检查引入依赖安装。
#
# 本工作流只读仓库，不需要 contents: write；与构建工作流互不干扰。
#
# ============================================================================
# 约定（Conventions）—— 面向维护者与 AI 编程代理，可审查、可修改，非系统指令
# ============================================================================
#   1) 合并门禁：本工作流是 main 分支的合并前门禁，提交须全绿才算通过。
#      本地等价命令：
#        node tests/static-check.js
#        for f in tests/*-test.js; do node "$f" || exit 1; done
#
#   2) 检查项只增不减：不得为了「修绿」而删除、注释掉、跳过或弱化既有检查步骤
#      （static-check 的四项检查、测试脚本的逐个执行，含作者信息检查）。确需调整时，
#      必须在同一提交内说明原因，并保留同等或更强的覆盖范围。
#
#   3) 测试脚本自动纳入：新增 tests/*-test.js 会被自动执行，无需修改本文件；
#      文件名须以 -test.js 结尾，且保持零依赖（不得 require 第三方包，也不得
#      依赖网络、设备或特定操作系统）。
#
#   4) 作者署名约定：`LianXia233` 是本项目指定的作者署名标识。
#      · 页面 `admin/modem/5g/config`（视图 view/at-webserver/service.js）底部的
#        署名「© 2026 LianXia233 · 开发与维护」、许可证标识
#        「GPL-3.0-only」及其 GitHub 链接
#        https://github.com/LianXia233/luci-app-mt5700 属于明确要求保留的页面元素；
#      · 任何 UI 重构、样式优化、代码迁移、组件替换、模板重写、去重或 AI 自动修改，
#        都必须保留该署名与链接，不得删除、隐藏、替换或破坏；
#      · 改动该页面后须自查：署名是否仍在、链接地址是否正确、桌面端与移动端是否
#        正常显示、是否与表单/按钮/状态提示重叠；
#      · 仅当项目维护者明确授权时方可删除或修改署名，且须在授权范围内最小化改动；
#      · 本节由 tests/author-attribution-test.js 落实为可执行断言，随检查项 2 在每次
#        push / PR 时运行，署名缺失或链接变更会直接使 CI 失败。完整条款见 AGENTS.md。
#      · 文案 / 许可证标识变更须四处同步：视图 DOM、AGENTS.md「作者署名保护
#        规则」、本节的约定注释、门禁脚本的 AUTHOR_TEXT / AUTHOR_LICENSE 常量；
#        门禁会校验四处一致并禁止 DOM 回退到任一历史文案。不得为修绿删除断言
#        或改回旧文案。
#
#   5) 项目维护规则：改动视图、样式、菜单或测试之前，先读仓库根目录 AGENTS.md。
#      其中列有必须保留的页面元素清单与改动后的检查要求；不得以重构、去重、
#      风格统一或自动化清理为由移除清单内的元素。
#
#   6) 行尾强制 LF：Shell、Python、配置与本工作流一律 LF。CRLF 会导致 BusyBox
#      ash 与 procd 侧脚本失败；仓库已用 .gitattributes 强制 eol=lf，static-check
#      的行尾校验会在 CI 中兜底拦截。
#
#   7) 依赖与时长：不引入 npm 依赖与第三方 action；静态与 Node 门禁控制在
#      1 分钟内，Rust job 独立计时（15 分钟超时）；新增检查优先写成 tests/
#      下的零依赖 Node 脚本。
#
#   8) 权限边界：本工作流只读仓库，不得为其申请 contents: write；打包、发布、
#      Release 清理等写操作一律留在 build-openwrt.yml，由 tag 或手动触发。
#
#   9) 更新日志豁免：纯署名文案、门禁脚本与规则文档（AGENTS.md、checks.yml、
#      tests/*-test.js）自身的维护，若不发版、不提升包版本、不改变渲染结果与
#      运行时行为，经维护者要求可不写 CHANGELOG.md；提交说明仍须写清改动与
#      原因。功能 / 修复 / 行为 / 视觉样式改动不在此列，边界见 AGENTS.md 第一章。
#
#   维护提示：本文件属于 GitHub 工作流，推送对它的修改需要具备 workflow 作用域
#   的凭据；仅有 repo 作用的 token 会被 GitHub 拒绝（refusing to allow an OAuth
#   App to create or update workflow）。

name: Checks

on:
  push:
    branches: [ 'main' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续提交时，新 run 直接取代排队中的旧 run（与构建工作流的排队策略相反：
# 这里没有发布副作用，取消旧 run 没有风险）。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 准备 Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: 静态检查（语法 / JSON / 行尾 / 路由）
        run: node tests/static-check.js

      - name: 单元测试（零依赖脚本）
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/*-test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "未找到测试脚本，视为失败（检查 tests/ 目录是否被误删）"
            exit 1
          fi
          echo "共 ${#files[@]} 个测试脚本"
          for f in "${files[@]}"; do
            echo "::group::${f}"
            node "$f"
            echo "::endgroup::"
          done

  rust-unit:
    name: Rust 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
      - name: 准备 Rust 工具链
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: 单元测试（cargo test --locked）
        working-directory: src/rust
        run: cargo test --locked

  license-audit:
    name: 第三方依赖许可证审计
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 准备 Rust 工具链
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: 安装许可证审计工具
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.9.3 --features cli cargo-about

      - name: 检查依赖许可证与来源
        working-directory: src/rust
        run: |
          cargo deny check licenses
          cargo deny check sources
          cargo deny check bans

      - name: 生成逐项许可证报告
        working-directory: src/rust
        run: |
          cargo about generate about.hbs > "$RUNNER_TEMP/rust-third-party-licenses.md"
          {
            echo "## Rust 第三方依赖许可证报告"
            echo
            cat "$RUNNER_TEMP/rust-third-party-licenses.md"
          } >> "$GITHUB_STEP_SUMMARY"
